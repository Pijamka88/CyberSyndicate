/* ---------- ХОЛСТ И КАЧЕСТВО ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;
const lightCv=document.createElement('canvas'),lctx=lightCv.getContext('2d');
const QC=[{d:2,pc:260,ls:.5},{d:1.5,pc:170,ls:.45},{d:1,pc:110,ls:.4}];
let W=0,H=0,DPR=1,quality=0,SAFE={t:0,r:0,b:0,l:0};
const safeEl=document.createElement('div');
safeEl.style.cssText='position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';

function readSafe(){const cs=getComputedStyle(safeEl);
  SAFE={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,QC[quality].d);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  lightCv.width=Math.max(2,Math.round(W*QC[quality].ls));
  lightCv.height=Math.max(2,Math.round(H*QC[quality].ls));
}
addEventListener('resize',()=>{resize();readSafe();});
addEventListener('orientationchange',()=>setTimeout(()=>{resize();readSafe();},300));
document.addEventListener('gesturestart',e=>e.preventDefault());
cv.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});

/* ---------- УТИЛИТЫ ---------- */
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
function angLerp(a,b,t){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return a+d*t;}
function angDiff(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return Math.abs(d);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pSegDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0;t=clamp(t,0,1);
  return Math.hypot(px-(x1+dx*t),py-(y1+dy*t));}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function fmtMoney(n){return Math.floor(n).toLocaleString('ru-RU')+' ₽';}
function dirText(a){const names=['востоке','юго-востоке','юге','юго-западе','западе','северо-западе','севере','северо-востоке'];
  let i=Math.round(a/(Math.PI/4));i=((i%8)+8)%8;return names[i];}

/* ---------- ЗВУК ---------- */
let actx=null,master=null,noiseBuf=null,muted=false;
function initAudio(){if(actx)return;
  try{actx=new(window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=.4;master.connect(actx.destination);
    const len=(actx.sampleRate*.5)|0;noiseBuf=actx.createBuffer(1,len,actx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  }catch(e){}}
function tone(type,f0,f1,t,vol,dl){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+(dl||0);
  o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+t);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+t);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+t+.02);}
function noiseHit(t,vol,freq,dl){if(!actx)return;const s=actx.createBufferSource(),g=actx.createGain(),f=actx.createBiquadFilter(),t0=actx.currentTime+(dl||0);
  s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=.7;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+t);
  s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+t+.02);}
function sfx(n){if(!actx||muted)return;if(actx.state==='suspended')actx.resume();
  switch(n){
    case'shoot':noiseHit(.07,.5,2400);tone('square',170,50,.07,.25);break;
    case'shotgun':noiseHit(.16,.7,900);tone('square',110,35,.13,.3);break;
    case'eshoot':noiseHit(.06,.22,1800);tone('square',140,45,.06,.14);break;
    case'hit':tone('square',300,120,.05,.2);break;
    case'hurt':tone('sawtooth',130,60,.18,.3);break;
    case'pickup':tone('sine',620,930,.1,.25);break;
    case'money':tone('sine',880,880,.06,.2);tone('sine',1318,1318,.09,.2,.06);break;
    case'buy':tone('sine',523,523,.07,.2);tone('sine',784,784,.1,.2,.07);break;
    case'geiger':noiseHit(.012,.25,5200);break;
    case'zap':noiseHit(.1,.5,3200);tone('sawtooth',900,120,.12,.2);break;
    case'burst':noiseHit(.3,.6,500);tone('sine',90,35,.35,.45);break;
    case'bark':tone('sawtooth',330,150,.1,.22);tone('sawtooth',300,130,.1,.18,.13);break;
    case'reload':noiseHit(.03,.3,2000);noiseHit(.04,.3,1400,.15);break;
    case'quest':tone('sine',659,659,.1,.18);tone('sine',880,880,.1,.18,.1);tone('sine',1046,1046,.16,.18,.2);break;
    case'die':tone('sawtooth',200,40,.7,.35);break;
    case'siren':tone('sawtooth',420,300,1.2,.16);tone('sawtooth',300,420,1.2,.16,1.2);break;
    case'thunder':noiseHit(.9,.55,220);tone('sine',70,30,.8,.3);break;
    case'click':tone('square',900,700,.03,.12);break;
    case'bolt':noiseHit(.03,.2,3000);break;
    case'grunt':tone('sawtooth',90,45,.25,.3);noiseHit(.15,.2,300);break;
    case'snort':noiseHit(.12,.4,500);tone('square',140,80,.1,.2);break;
    case'squeak':tone('square',1900,2400,.05,.12);break;
    case'flap':noiseHit(.08,.15,900);noiseHit(.08,.12,700,.09);break;
    case'bsg':tone('sawtooth',150,55,.4,.3);noiseHit(.22,.25,380);tone('sawtooth',95,40,.35,.22,.12);break;
  }}
function sfxFar(n,x,y){if(dist(x,y,player.x,player.y)<950)sfx(n);}

/* ---------- ВВОД ---------- */
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;
  if(e.code==='Tab'){e.preventDefault();if(state==='game')bagOpen=!bagOpen;}
  if(e.code==='KeyE'&&state==='game'&&!shopOpen&&!bagOpen)performInteract();
  if(e.code==='KeyQ'&&state==='game'&&!shopOpen&&!bagOpen)throwBolt();
  if(e.code==='KeyR'&&state==='game')startReload();
  if(e.code==='KeyH'&&state==='game')useMed();
  if(e.code==='KeyK'&&state==='game')usePill();
  if(e.code==='KeyM'){muted=!muted;msg(muted?'Звук выключен':'Звук включен');}
  if(e.code==='Escape'){shopOpen=false;bagOpen=false;}
  if(e.code==='Digit1')selectWeapon('pm');
  if(e.code==='Digit2')selectWeapon('cut');
  if(e.code==='Digit3')selectWeapon('aks');
});
addEventListener('keyup',e=>{keys[e.code]=false;});
let mx=W/2,my=H/2,mDown=false;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});

const joyL={id:-1,ox:0,oy:0,x:0,y:0,active:false};
const joyR={id:-1,ox:0,oy:0,x:0,y:0,active:false};
let hudHits=[],shopHits=[],bagHits=[],introHit=null,newHit=null,deadHit=null;
function uiTap(sx,sy){
  if(state==='intro'){
    if(introHit&&sx>=introHit.x&&sx<=introHit.x+introHit.w&&sy>=introHit.y&&sy<=introHit.y+introHit.h){startGame();return true;}
    if(newHit&&sx>=newHit.x&&sx<=newHit.x+newHit.w&&sy>=newHit.y&&sy<=newHit.y+newHit.h){newGame();return true;}
    return false;}
  if(state==='dead'){if(deadHit&&sx>=deadHit.x&&sx<=deadHit.x+deadHit.w&&sy>=deadHit.y&&sy<=deadHit.y+deadHit.h){respawn();return true;}return false;}
  for(const h of hudHits){if(h.r!==undefined){if(dist(sx,sy,h.x,h.y)<=h.r+8){h.cb();sfx('click');return true;}}
    else if(sx>=h.x&&sx<=h.x+h.w&&sy>=h.y&&sy<=h.y+h.h){h.cb();sfx('click');return true;}}
  if(shopOpen){for(const h of shopHits){if(sx>=h.x&&sx<=h.x+h.w&&sy>=h.y&&sy<=h.y+h.h){h.cb();return true;}}return true;}
  if(bagOpen){for(const h of bagHits){if(sx>=h.x&&sx<=h.x+h.w&&sy>=h.y&&sy<=h.y+h.h){h.cb();return true;}}return true;}
  return false;
}
cv.addEventListener('touchstart',e=>{e.preventDefault();initAudio();if(actx&&actx.state==='suspended')actx.resume();
  for(const t of e.changedTouches){
    const sx=t.clientX,sy=t.clientY;
    if(uiTap(sx,sy))continue;
    if(state!=='game'||shopOpen||bagOpen)continue;
    if(sx<W*.45&&joyL.id<0){joyL.id=t.identifier;joyL.ox=sx;joyL.oy=sy;joyL.x=0;joyL.y=0;joyL.active=true;}
    else if(sx>W*.45&&joyR.id<0){joyR.id=t.identifier;joyR.ox=sx;joyR.oy=sy;joyR.x=0;joyR.y=0;joyR.active=true;}
  }},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyL.id){const dx=t.clientX-joyL.ox,dy=t.clientY-joyL.oy,l=Math.hypot(dx,dy),m=Math.min(l,58);
      joyL.x=l?dx/l*m/58:0;joyL.y=l?dy/l*m/58:0;}
    if(t.identifier===joyR.id){const dx=t.clientX-joyR.ox,dy=t.clientY-joyR.oy,l=Math.hypot(dx,dy),m=Math.min(l,58);
      joyR.x=l?dx/l*m/58:0;joyR.y=l?dy/l*m/58:0;}
  }},{passive:false});
function touchEnd(e){e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyL.id){joyL.id=-1;joyL.active=false;joyL.x=joyL.y=0;}
    if(t.identifier===joyR.id){joyR.id=-1;joyR.active=false;joyR.x=joyR.y=0;}
  }}
cv.addEventListener('touchend',touchEnd,{passive:false});
cv.addEventListener('touchcancel',touchEnd,{passive:false});
cv.addEventListener('mousedown',e=>{initAudio();
  if(uiTap(e.clientX,e.clientY))return;
  if(state==='game'&&!shopOpen&&!bagOpen)mDown=true;});
addEventListener('mouseup',()=>mDown=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());

  {x:610,y:7128,c:'#5a4a38',h:'#c9a179'},{x:648,y:7116,c:'#44523f',h:'#9a7a52'}];

function inBase(x,y,p){p=p||0;return x>BASE.x-p&&x<BASE.x+BASE.w+p&&y>BASE.y-p&&y<BASE.y+BASE.h+p;}
function inShelter(x,y){
  for(const s of shelters)
    if(x>s.x+10&&x<s.x+s.w-10&&y>s.y+10&&y<s.y+s.h-10)return true;
  return false;}
function isSafe(x,y){return inBase(x,y)||inShelter(x,y);}
function nearRoad(x,y,d){for(const s of ROAD)if(pSegDist(x,y,s[0],s[1],s[2],s[3])<d)return true;return false;}
function nearBuild(x,y,p){for(const b of builds)if(x>b.x-p&&x<b.x+b.w+p&&y>b.y-p&&y<b.y+b.h+p)return true;return false;}
function nearCamp(x,y,d){for(const c of CAMPS)if(dist(x,y,c.x,c.y)<d)return true;
  if(dist(x,y,FIRE_PIT.x,FIRE_PIT.y)<d)return true;return false;}

/* ---------- СЕТКА КОЛЛИЗИЙ ---------- */
const GRID=200,gMap=new Map();
const gK=(gx,gy)=>(gx+4)*64+(gy+4);
function gridAddC(o){const k=gK(Math.floor(o.x/GRID),Math.floor(o.y/GRID));
  let c=gMap.get(k);if(!c){c={c:[],r:[]};gMap.set(k,c);}c.c.push(o);}
function gridAddR(o){const x0=Math.floor((o.x-2)/GRID),x1=Math.floor((o.x+o.w+2)/GRID),
  y0=Math.floor((o.y-2)/GRID),y1=Math.floor((o.y+o.h+2)/GRID);
  for(let gx=x0;gx<=x1;gx++)for(let gy=y0;gy<=y1;gy++){const k=gK(gx,gy);
    let c=gMap.get(k);if(!c){c={c:[],r:[]};gMap.set(k,c);}c.r.push(o);}}
function resolveColl(e){
  const gx=Math.floor(e.x/GRID),gy=Math.floor(e.y/GRID);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
    const c=gMap.get(gK(gx+i,gy+j));if(!c)continue;
    for(let n=0;n<c.r.length;n++){const r=c.r[n];
      const nx=clamp(e.x,r.x,r.x+r.w),ny=clamp(e.y,r.y,r.y+r.h);
      const dx=e.x-nx,dy=e.y-ny,d=Math.hypot(dx,dy);
      if(d<e.r){if(d===0){e.y=r.y-e.r;}else{e.x=nx+dx/d*e.r;e.y=ny+dy/d*e.r;}}}
    for(let n=0;n<c.c.length;n++){const o=c.c[n];
      const dx=e.x-o.x,dy=e.y-o.y,d=Math.hypot(dx,dy),m=e.r+o.r;
      if(d<m&&d>0){e.x=o.x+dx/d*m;e.y=o.y+dy/d*m;}}}
  e.x=clamp(e.x,e.r,WORLD-e.r);e.y=clamp(e.y,e.r,WORLD-e.r);
}
function pointSolid(x,y){
  const c=gMap.get(gK(Math.floor(x/GRID),Math.floor(y/GRID)));if(!c)return false;
  for(let n=0;n<c.r.length;n++){const r=c.r[n];
    if(x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h)return true;}
  for(let n=0;n<c.c.length;n++){const o=c.c[n];
    if(dist(x,y,o.x,o.y)<o.r)return true;}
  return false;
}
function los(x1,y1,x2,y2){
  const d=dist(x1,y1,x2,y2),steps=Math.ceil(d/44);
  if(steps<2)return true;
  const dx=(x2-x1)/steps,dy=(y2-y1)/steps;
  let x=x1,y=y1;
  for(let i=1;i<steps;i++){
    x+=dx;y+=dy;
    const c=gMap.get(gK(Math.floor(x/GRID),Math.floor(y/GRID)));
    if(c)for(let n=0;n<c.r.length;n++){const r=c.r[n];
      if(r.bv&&x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h)return false;}
  }
  return true;
}

/* стены заходимого здания с дверным проёмом */
function openWalls(b,T,dw){
  b.T=T;b.dw=dw;const {x,y,w,h}=b,segs=[];
  const mid=(a,s)=>a+(s-dw)/2;
  if(b.door==='s'){
    segs.push([x,y,w,T],[x,y,T,h],[x+w-T,y,T,h]);
    const dx=mid(x,w);
    segs.push([x,y+h-T,dx-x,T],[dx+dw,y+h-T,w-(dx-x)-dw,T]);
  }else if(b.door==='n'){
    segs.push([x,y+h-T,w,T],[x,y,T,h],[x+w-T,y,T,h]);
    const dx=mid(x,w);
    segs.push([x,y,dx-x,T],[dx+dw,y,w-(dx-x)-dw,T]);
  }else if(b.door==='e'){
    segs.push([x,y,w,T],[x,y+h-T,w,T],[x,y,T,h]);
    const dy=mid(y,h);
    segs.push([x+w-T,y,T,dy-y],[x+w-T,dy+dw,T,h-(dy-y)-dw]);
  }else{
    segs.push([x,y,w,T],[x,y+h-T,w,T],[x+w-T,y,T,h]);
    const dy=mid(y,h);
    segs.push([x,y,T,dy-y],[x,dy+dw,T,h-(dy-y)-dw]);
  }
  b._segs=segs;
  for(const s of segs)gridAddR({x:s[0],y:s[1],w:s[2],h:s[3],bv:true});
}

/* ---------- ГЕНЕРАЦИЯ СЕКТОРА ---------- */
function mkTree(x,y,rng){return{x,y,cr:24+rng()*18,pine:rng()<.4,
  dx:(rng()-.5)*12,dy:(rng()-.5)*12,dx2:(rng()-.5)*10,dy2:(rng()-.5)*10};}
function mkAnom(type,x,y,rng){rng=rng||Math.random;
  const a={type,x,y,r:52+rng()*22,ph:rng()*10,cd:.3+rng()*1.7,act:0,zapT:0,zaps:null,
    artT:20+rng()*70,art:null,grad:null,scorch:null};
  if(rng()<.38)a.art=ART_ANOM[type][irand(0,ART_ANOM[type].length-1)];
  return a;}
function secGen(s){
  s.gen=true;s.explored=true;
  const rng=mulberry32(((s.i*73856093)^(s.j*19349663)^424242)|0);
  const placed=[];
  const free=(x,y,r)=>{for(let k=0;k<placed.length;k++){const p=placed[k];
    if(dist(x,y,p.x,p.y)<r+p.r)return false;}return true;};
  const put=(x,y,r)=>{placed.push({x,y,r});};
  const edge=(x,y,m)=>x>s.i*SEC+m&&x<(s.i+1)*SEC-m&&y>s.j*SEC+m&&y<(s.j+1)*SEC-m;
  const ok=(x,y,pad)=>!(inBase(x,y,pad)||nearRoad(x,y,pad+10)||nearBuild(x,y,pad)||nearCamp(x,y,pad+60));
  const px=()=>s.i*SEC+60+rng()*(SEC-120),py=()=>s.j*SEC+60+rng()*(SEC-120);
  const groves=1+((rng()*2)|0);
  for(let g=0;g<groves;g++){
    let cx,cy,tr=0;
    do{cx=px();cy=py();tr++;}while(tr<30&&!ok(cx,cy,150));
    if(tr>=30)continue;
    const n=8+((rng()*12)|0);
    for(let k=0;k<n;k++){const x=cx+(rng()-.5)*500,y=cy+(rng()-.5)*500;
      if(x<60||y<60||x>WORLD-60||y>WORLD-60)continue;
      if(!edge(x,y,80)||!ok(x,y,60)||!free(x,y,48))continue;
      const t=mkTree(x,y,rng);s.trees.push(t);put(x,y,46);gridAddC({x,y,r:10});}}
  for(let k=0,n=3+((rng()*5)|0);k<n;k++){
    const x=px(),y=py();
    if(ok(x,y,70)&&edge(x,y,80)&&free(x,y,48)){s.trees.push(mkTree(x,y,rng));put(x,y,46);gridAddC({x,y,r:10});}}
  for(let k=0,n=3+((rng()*4)|0);k<n;k++){
    const x=px(),y=py();if(!ok(x,y,40)||!edge(x,y,80)||!free(x,y,32))continue;
    const r=7+rng()*10;s.rocks.push({x,y,r});put(x,y,30);gridAddC({x,y,r:r*.85});}
  for(let k=0,n=5+((rng()*5)|0);k<n;k++){
    const x=px(),y=py();if(!ok(x,y,30)||!edge(x,y,60)||!free(x,y,38))continue;
    s.bushes.push({x,y,r:15+rng()*8,berry:rng()<.4});put(x,y,26);}
  for(let k=0,n=4+((rng()*4)|0);k<n;k++){
    const x=px(),y=py();if(!ok(x,y,14)||!edge(x,y,40)||!free(x,y,30))continue;
    const bl=[],bn=6+((rng()*5)|0);
    for(let b=0;b<bn;b++)bl.push({dx:(rng()-.5)*50,dy:(rng()-.5)*30,a:-.6+rng()*1.2,l:7+rng()*9});
    s.grass.push({x,y,ph:rng()*9,bl});}
  for(let k=0,n=2+((rng()*3)|0);k<n;k++){
    const x=px(),y=py();if(!ok(x,y,10)||!free(x,y,22))continue;
    const pts=[],m=4+((rng()*4)|0);
    for(let p=0;p<m;p++)pts.push({dx:(rng()-.5)*36,dy:(rng()-.5)*24,
      c:['#d8d4c8','#d8c94a','#a08cd0'][(rng()*3)|0]});
    s.flowers.push({x,y,pts});}
  for(let k=0,n=(rng()*2.4)|0;k<n;k++){
    const x=px(),y=py();if(!ok(x,y,50)||!edge(x,y,90)||!free(x,y,42))continue;
    const a=rng()*TAU,len=40+rng()*18;
    s.logs.push({x,y,a,len});
    put(x+Math.cos(a)*(len/2-8),y+Math.sin(a)*(len/2-8),24);
    put(x-Math.cos(a)*(len/2-8),y-Math.sin(a)*(len/2-8),24);
    gridAddC({x:x+Math.cos(a)*(len/2-8),y:y+Math.sin(a)*(len/2-8),r:11});
    gridAddC({x:x-Math.cos(a)*(len/2-8),y:y-Math.sin(a)*(len/2-8),r:11});}
  for(let k=0,n=4+((rng()*4)|0);k<n;k++){
    if(!s.trees.length)break;
    const t=s.trees[(rng()*s.trees.length)|0];
    s.mush.push({x:t.x+(rng()-.5)*60,y:t.y+(rng()-.5)*60,c:rng()<.5?'#a04030':'#8a6a45'});}
  for(let k=0,n=(rng()*3)|0;k<n;k++){const x=px(),y=py();
    if(ok(x,y,20)&&free(x,y,28)){s.stumps.push({x,y,r:8+rng()*5});put(x,y,18);}}
  for(let k=0,n=3+((rng()*4)|0);k<n;k++){const x=px(),y=py();if(ok(x,y,10))s.pebbles.push({x,y,n:2+((rng()*3)|0)});}
  const roll=rng();let type=null;
  if(roll<.30)type='fire';else if(roll<.52)type='elec';else if(roll<.72)type='tor';
  if(type){
    const cx=s.i*SEC+220+rng()*(SEC-440),cy=s.j*SEC+220+rng()*(SEC-440);
    const rad=160+rng()*240,n=1+((rng()*3)|0);
    for(let k=0;k<n;k++){const a=rng()*TAU,d=rng()*rad;
      const x=clamp(cx+Math.cos(a)*d,80,WORLD-80),y=clamp(cy+Math.sin(a)*d,80,WORLD-80);
      if(inBase(x,y,600)||nearRoad(x,y,110)||nearBuild(x,y,80)||nearCamp(x,y,220))continue;
      if(!free(x,y,86))continue;
      const an=mkAnom(type,x,y,rng);s.anoms.push(an);put(x,y,84);}}
  for(const a of s.extra)s.anoms.push(a);
  if(rng()<.35){let x,y,tr=0;
    do{x=px();y=py();tr++;}while(tr<40&&!(ok(x,y,80)&&free(x,y,58)));
    if(tr<40){s.stash={x,y};put(x,y,20);}}
  if(rng()<.4){let x,y,tr=0;
    do{x=px();y=py();tr++;}while(tr<30&&!ok(x,y,60));
    if(tr<30)s.birdP={x,y};}
}

/* ---------- АКТИВАЦИЯ СЕКТОРОВ ---------- */
let activeSecs=[];
function activateSector(s){
  for(const c of s.camps)while(c.alive<c.n)spawnMerc(c);
  for(const p of s.dogs)while(p.alive<p.n)spawnDog(p);
  for(const p of s.fls)while(p.alive<p.n)spawnFlesh(p);
  for(const p of s.brs)while(p.alive<p.n)spawnBoar(p);
  for(const p of s.rts)while(p.alive<p.n)spawnRat(p);
  for(const p of s.bs)while(p.alive<p.n)spawnBlood(p);
  if(s.birdP){const n=4+irand(0,3);
    for(let k=0;k<n;k++)birds.push({x:s.birdP.x+rand(-46,46),y:s.birdP.y+rand(-46,46),
      hop:rand(0,2),fly:0,vx:0,vy:0,sec:s.idx});}
}
function despawnSector(s){
  for(let i=mercs.length-1;i>=0;i--)if(mercs[i].sec===s.idx){mercs[i].camp.alive--;mercs.splice(i,1);}
  for(let i=dogs.length-1;i>=0;i--)if(dogs[i].sec===s.idx){dogs[i].pack.alive--;dogs.splice(i,1);}
  for(let i=flesh.length-1;i>=0;i--)if(flesh[i].sec===s.idx){flesh[i].pack.alive--;flesh.splice(i,1);}
  for(let i=boars.length-1;i>=0;i--)if(boars[i].sec===s.idx){boars[i].pack.alive--;boars.splice(i,1);}
  for(let i=rats.length-1;i>=0;i--)if(rats[i].sec===s.idx){rats[i].pack.alive--;rats.splice(i,1);}
  for(let i=bloods.length-1;i>=0;i--)if(bloods[i].sec===s.idx){bloods[i].pack.alive--;bloods.splice(i,1);}
  for(let i=birds.length-1;i>=0;i--)if(birds[i].sec===s.idx)birds.splice(i,1);
}
function updateActiveSectors(){
  const pi=clamp((player.x/SEC)|0,0,SECN-1),pj=clamp((player.y/SEC)|0,0,SECN-1);
  const newList=[];
  for(let i=Math.max(0,pi-1);i<=Math.min(SECN-1,pi+1);i++)
    for(let j=Math.max(0,pj-1);j<=Math.min(SECN-1,pj+1);j++){
      const s=sectors[i*SECN+j];
      if(!s.gen)secGen(s);
      if(!s.active){s.active=true;activateSector(s);}
      newList.push(s);}
  for(const s of sectors)if(s.active&&newList.indexOf(s)<0){s.active=false;despawnSector(s);}
  activeSecs=newList;
}

const CHUNK=512,chunkCache=new Map(),chunkPool=[];let frameN=0;
const MAXC=56;
const vbC={x1:0,y1:0,x2:0,y2:0};
function chunkVisible(cx,cy){const x0=cx*CHUNK,y0=cy*CHUNK;
  return x0<vbC.x2&&x0+CHUNK>vbC.x1&&y0<vbC.y2&&y0+CHUNK>vbC.y1;}
function paintChunk(g,cx,cy){
  const wx0=cx*CHUNK,wy0=cy*CHUNK;
  const rng=mulberry32((cx*73856093)^(cy*19349663)^991);
  g.fillStyle='#454a36';g.fillRect(0,0,CHUNK,CHUNK);
  const pal=['#4d5340','#3c4130','#514b3a','#474d39'];
  for(let i=0;i<26;i++){g.fillStyle=pal[(rng()*pal.length)|0];g.globalAlpha=.55;
    g.beginPath();g.ellipse(rng()*CHUNK,rng()*CHUNK,20+rng()*80,14+rng()*60,rng()*TAU,0,TAU);g.fill();}
  g.globalAlpha=1;
  for(const z of ZONES){
    if(z.x+z.r<wx0||z.x-z.r>wx0+CHUNK||z.y+z.r<wy0||z.y-z.r>wy0+CHUNK)continue;
    g.fillStyle=z.c;g.beginPath();g.arc(z.x-wx0,z.y-wy0,z.r,0,TAU);g.fill();}
  if(wx0<BASE.x+BASE.w&&wx0+CHUNK>BASE.x&&wy0<BASE.y+BASE.h&&wy0+CHUNK>BASE.y){
    g.fillStyle='#57534a';g.globalAlpha=.9;
    g.fillRect(BASE.x-wx0,BASE.y-wy0,BASE.w,BASE.h);g.globalAlpha=1;
    g.strokeStyle='#665f50';g.lineCap='round';
    g.lineWidth=36;g.beginPath();g.moveTo(640-wx0,6880-wy0);g.lineTo(640-wx0,7150-wy0);
    g.lineTo(770-wx0,7235-wy0);g.stroke();
    g.lineWidth=24;g.beginPath();g.moveTo(640-wx0,7090-wy0);g.lineTo(520-wx0,7100-wy0);
    g.lineTo(470-wx0,7000-wy0);g.stroke();
    g.fillStyle='#3a342a';g.globalAlpha=.5;
    g.beginPath();g.arc(FIRE_PIT.x-wx0,FIRE_PIT.y-wy0,42,0,TAU);g.fill();g.globalAlpha=1;
    for(let i=0;i<10;i++){g.fillStyle='#4e4940';g.globalAlpha=.5;
      g.beginPath();g.arc(BASE.x-wx0+rng()*BASE.w,BASE.y-wy0+rng()*BASE.h,3+rng()*6,0,TAU);g.fill();g.globalAlpha=1;}}
  g.lineCap='round';g.lineJoin='round';
  for(const pass of [[86,'#565248'],[74,'#5f594e']]){
    g.strokeStyle=pass[1];g.lineWidth=pass[0];
    for(const s of ROAD){g.beginPath();g.moveTo(s[0]-wx0,s[1]-wy0);g.lineTo(s[2]-wx0,s[3]-wy0);g.stroke();}}
  for(let i=0;i<10;i++){g.fillStyle='#4e4940';g.globalAlpha=.5;
    g.beginPath();g.arc(rng()*CHUNK,rng()*CHUNK,4+rng()*10,0,TAU);g.fill();g.globalAlpha=1;}
  g.strokeStyle='#39402c';g.lineWidth=1.5;
  for(let i=0;i<120;i++){const x=rng()*CHUNK,y=rng()*CHUNK,l=3+rng()*6,a=rng()*TAU;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
  for(const s of radSpots){if(s.x+s.r<wx0||s.x-s.r>wx0+CHUNK||s.y+s.r<wy0||s.y-s.r>wy0+CHUNK)continue;
    g.fillStyle='#8a7a30';g.globalAlpha=.10;
    g.beginPath();g.arc(s.x-wx0,s.y-wy0,s.r,0,TAU);g.fill();
    g.globalAlpha=.16;
    for(let i=0;i<8;i++){g.beginPath();
      g.arc(s.x-wx0+(rng()-.5)*s.r*1.4,s.y-wy0+(rng()-.5)*s.r*1.4,10+rng()*40,0,TAU);g.fill();}
    g.globalAlpha=1;}
}
function getChunk(cx,cy){
  const k=cx*64+cy;let e=chunkCache.get(k);
  if(e){e.u=frameN;return e.cv;}
  const c=chunkPool.pop()||document.createElement('canvas');
  c.width=CHUNK;c.height=CHUNK;
  paintChunk(c.getContext('2d'),cx,cy);
  chunkCache.set(k,{cv:c,u:frameN});
  if(chunkCache.size>MAXC)evictChunks();
  return c;
}
function evictChunks(){
  const arr=[...chunkCache.entries()].sort((a,b)=>a[1].u-b[1].u);
  let need=chunkCache.size-MAXC+6;
  for(const [k,e] of arr){if(need<=0)break;
    const cx=Math.floor(k/64),cy=k-cx*64;
    if(chunkVisible(cx,cy))continue;
    chunkCache.delete(k);if(chunkPool.length<24)chunkPool.push(e.cv);need--;}
}

/* ---------- ЧАСТИЦЫ / ДЕКАЛИ / СООБЩЕНИЯ ---------- */
function addPart(x,y,vx,vy,life,size,color,grav,fade){if(parts.length>=QC[quality].pc)parts.shift();
  parts.push({x,y,vx,vy,life,tl:life,size,color,grav:grav||0,fade:fade!==false});}
function addDecal(x,y,r,color,life){if(decals.length>80)decals.shift();decals.push({x,y,r,color,life,tl:life});}
function msg(text,color){msgs.push({text,color:color||'#d8d4c4',t:4.5});if(msgs.length>4)msgs.shift();}

/* ---------- СТРЕЛЬБА ---------- */
function muzzlePos(){const w=WPN[player.cur];
  return{x:player.x+Math.cos(player.aim)*(w.len+8),y:player.y+Math.sin(player.aim)*(w.len+8)};}
function shootPlayer(){
  const w=WPN[player.cur];
  if(player.rel>0||player.cool>0)return;
  if(player.mags[player.cur]<=0){startReload();return;}
  player.mags[player.cur]--;player.cool=w.rof;
  const m=muzzlePos();
  for(let i=0;i<w.pel;i++){const a=player.aim+(Math.random()-.5)*2*w.spr;
    bullets.push({x:m.x,y:m.y,vx:Math.cos(a)*w.spd,vy:Math.sin(a)*w.spd,life:.9,side:'p',dmg:w.dmg});}
  lights.push({x:m.x,y:m.y,r:130,t:.08,tl:.08});
  shake=Math.min(shake+2,7);sfx(w.snd);
  for(let i=0;i<3;i++)addPart(m.x,m.y,Math.cos(player.aim)*rand(40,140)+rand(-40,40),
    Math.sin(player.aim)*rand(40,140)+rand(-40,40),.15,2,'#ffd98a',0);
}
function startReload(){const w=WPN[player.cur];
  if(player.rel>0||player.mags[player.cur]>=w.mag)return;
  if(player.ammo[w.ammo]<=0){msg('Нет патронов: '+w.ammo,'#d99a6b');return;}
  player.rel=w.rel;sfx('reload');}
function finishReload(){const w=WPN[player.cur];
  const need=w.mag-player.mags[player.cur],take=Math.min(need,player.ammo[w.ammo]);
  player.mags[player.cur]+=take;player.ammo[w.ammo]-=take;}
function selectWeapon(k){if(!player.owned[k]||player.cur===k)return;
  player.cur=k;player.rel=0;player.cool=.25;msg(WPN[k].name+' — в руки','#cfd4c0');}
function throwBolt(){if(player.boltCd>0)return;player.boltCd=.9;
  let tx,ty;
  if(isTouch){if(joyR.active&&Math.hypot(joyR.x,joyR.y)>.1){tx=player.x+joyR.x*260;ty=player.y+joyR.y*260;}
    else{tx=player.x+Math.cos(player.aim)*260;ty=player.y+Math.sin(player.aim)*260;}}
  else{tx=mx+cam.x;ty=my+cam.y;}
  const d=dist(player.x,player.y,tx,ty),m=Math.min(d,280);
  const a=Math.atan2(ty-player.y,tx-player.x);
  bolts.push({sx:player.x,sy:player.y,tx:player.x+Math.cos(a)*m,ty:player.y+Math.sin(a)*m,t:0,ang:a});
  sfx('bolt');}
function damagePlayer(d,sx,sy){
  if(player.dead||state!=='game'||player.grace>0)return;
  d*=player.armor*(1-.10*player.artifacts.filter(a=>a==='flash').length);
  player.hp-=d;dmgFlash=1;shake=Math.min(shake+3,8);sfx('hurt');
  addDecal(player.x+rand(-6,6),player.y+rand(-4,8),rand(3,6),'rgba(110,20,16,.5)',20);
  if(player.hp<=0){player.hp=0;player.dead=true;state='dead';sfx('die');}}
function damageMate(mt,d){if(mt.hp<=0)return;mt.hp=Math.max(0,mt.hp-d);mt.flash=.15;}

/* ---------- ПУЛИ ---------- */
function updBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    let dead=b.life<=0;
    if(!dead&&pointSolid(b.x,b.y)){dead=true;
      for(let k=0;k<3;k++)addPart(b.x,b.y,rand(-70,70),rand(-70,70),.2,1.6,'#cfc9a8',0);}
    if(!dead&&b.side==='p'){
      for(const m of mercs){if(m.hp<=0)continue;
        if(dist(b.x,b.y,m.x,m.y)<13){m.hp-=b.dmg;m.flash=.15;
          for(let k=0;k<4;k++)addPart(b.x,b.y,rand(-90,90),rand(-90,90),.3,2.4,'#8a1c14',0);
          sfx('hit');dead=true;if(m.hp<=0)killMerc(m,true);break;}}
      if(!dead)for(const dg of dogs){if(dg.hp<=0)continue;
        if(dist(b.x,b.y,dg.x,dg.y)<12){dg.hp-=b.dmg;dg.aggro=8;
          for(let k=0;k<4;k++)addPart(b.x,b.y,rand(-90,90),rand(-90,90),.3,2.4,'#7a1810',0);
          sfx('hit');dead=true;if(dg.hp<=0)killDog(dg);break;}}
      if(!dead)for(const f of flesh){if(f.hp<=0)continue;
        if(dist(b.x,b.y,f.x,f.y)<15){f.hp-=b.dmg;f.flash=.15;f.aggro=4;
          for(let k=0;k<4;k++)addPart(b.x,b.y,rand(-90,90),rand(-90,90),.3,2.4,'#6a4a38',0);
          sfx('hit');dead=true;if(f.hp<=0)killFlesh(f);break;}}
      if(!dead)for(const bo of boars){if(bo.hp<=0)continue;
        if(dist(b.x,b.y,bo.x,bo.y)<17){bo.hp-=b.dmg;bo.flash=.15;
          for(let k=0;k<4;k++)addPart(b.x,b.y,rand(-90,90),rand(-90,90),.3,2.4,'#4a3020',0);
          if(!bo.charging&&!inBase(player.x,player.y)){bo.charging=true;
            bo.ca=Math.atan2(player.y-bo.y,player.x-bo.x);bo.ct=1.2;}
          sfx('hit');dead=true;if(bo.hp<=0)killBoar(bo);break;}}
      if(!dead)for(const r of rats){if(r.hp<=0)continue;
        if(dist(b.x,b.y,r.x,r.y)<8){r.hp-=b.dmg;r.flee=2.5;
          addPart(b.x,b.y,rand(-60,60),rand(-60,60),.25,1.8,'#6a2020',0);
          dead=true;if(r.hp<=0)killRat(r);break;}}
      if(!dead)for(const bl of bloods){if(bl.hp<=0)continue;
        if(dist(b.x,b.y,bl.x,bl.y)<15){bl.hp-=b.dmg;bl.flash=.15;bl.hurtT=2.2;
          bl.alpha=1;bl.visible=true;
          for(let k=0;k<4;k++)addPart(b.x,b.y,rand(-80,80),rand(-80,80),.3,2.4,'#4a5a44',0);
          sfx('hit');dead=true;if(bl.hp<=0)killBlood(bl);break;}}
    }else if(!dead&&b.side==='m'){
      for(const m of mercs){if(m.hp<=0)continue;
        if(dist(b.x,b.y,m.x,m.y)<13){m.hp-=b.dmg;m.flash=.15;sfx('hit');dead=true;
          if(m.hp<=0)killMerc(m,false);break;}}
      if(!dead)for(const dg of dogs){if(dg.hp<=0)continue;
        if(dist(b.x,b.y,dg.x,dg.y)<12){dg.hp-=b.dmg;dead=true;sfx('hit');
          if(dg.hp<=0)killDog(dg);break;}}
      if(!dead)for(const f of flesh){if(f.hp<=0)continue;
        if(dist(b.x,b.y,f.x,f.y)<15){f.hp-=b.dmg;f.aggro=4;dead=true;sfx('hit');
          if(f.hp<=0)killFlesh(f);break;}}
      if(!dead)for(const bo of boars){if(bo.hp<=0)continue;
        if(dist(b.x,b.y,bo.x,bo.y)<17){bo.hp-=b.dmg;dead=true;
          if(!bo.charging){bo.charging=true;const pr=nearestPrey(bo.x,bo.y);
            bo.ca=Math.atan2((pr.t?pr.y:bo.y+1)-bo.y,(pr.t?pr.x:bo.x)-bo.x);bo.ct=1.2;}
          if(bo.hp<=0)killBoar(bo);break;}}
      if(!dead)for(const r of rats){if(r.hp<=0)continue;
        if(dist(b.x,b.y,r.x,r.y)<8){r.hp-=b.dmg;dead=true;if(r.hp<=0)killRat(r);break;}}
      if(!dead)for(const bl of bloods){if(bl.hp<=0)continue;
        if(dist(b.x,b.y,bl.x,bl.y)<15){bl.hp-=b.dmg;bl.hurtT=2.2;bl.alpha=1;bl.visible=true;
          dead=true;sfx('hit');if(bl.hp<=0)killBlood(bl);break;}}
    }else if(!dead&&b.side==='e'){
      if(!player.dead&&dist(b.x,b.y,player.x,player.y)<12){damagePlayer(b.dmg);dead=true;}
      if(!dead)for(const mt of mates){if(mt.hp<=0)continue;
        if(dist(b.x,b.y,mt.x,mt.y)<12){damageMate(mt,b.dmg);
          if(mt.hp<=0)killMate(mt);dead=true;break;}}
      if(!dead)for(const a of allies){if(a.dead)continue;
        if(dist(b.x,b.y,a.x,a.y)<12){a.hp-=b.dmg;a.flash=.15;dead=true;sfx('hit');
          if(a.hp<=0){a.dead=true;a.deadT=340;
            addDecal(a.x,a.y,13,'rgba(70,16,12,.45)',30);
            msg(a.name+' пал в бою. Зона заберёт своего.','#d98a6b');}
          break;}}
    }
    if(dead)bullets.splice(i,1);}
}
function killMerc(m,byPlayer){m.camp.alive--;stats.kills++;addDecal(m.x,m.y,13,'rgba(70,16,12,.45)',30);
  pickups.push({type:'money',x:m.x+rand(-8,8),y:m.y+rand(-8,8),v:irand(40,160)});
  if(Math.random()<.35)pickups.push({type:'ammo',ammo:['9x18','5.45','12к'][irand(0,2)],x:m.x+rand(-14,14),y:m.y+rand(-14,14),v:irand(8,25)});
  if(Math.random()<.12)pickups.push({type:'med',x:m.x+rand(-12,12),y:m.y+rand(-12,12)});
  if(byPlayer&&quest.active&&QUESTS[quest.i].type==='kill'){quest.progress++;checkQuestMsg();}
  const i=mercs.indexOf(m);if(i>=0)mercs.splice(i,1);}

function killBoar(b){b.pack.alive--;addDecal(b.x,b.y,16,'rgba(48,30,16,.5)',30);

function killRat(r){r.pack.alive--;

function killBlood(b){b.pack.alive--;stats.kills++;addDecal(b.x,b.y,16,'rgba(30,42,28,.55)',30);
  pickups.push({type:'money',x:b.x+rand(-8,8),y:b.y+rand(-8,8),v:irand(300,600)});

function killMate(mt){const i=mates.indexOf(mt);if(i>=0)mates.splice(i,1);
  mt.post.hired=false;mt.post.respawnT=320;
  addDecal(mt.x,mt.y,13,'rgba(70,16,12,.45)',30);
  msg(mt.name+' погиб. Пост опустел — замена будет не скоро.','#d98a6b');sfx('die');}

function nearestPrey(x,y){
  let best=1e9,t=null;
  if(!player.dead&&!player.hidden){const d=dist(x,y,player.x,player.y);if(d<best){best=d;t=player;}}
  for(const mt of mates){const d=dist(x,y,mt.x,mt.y);if(d<best){best=d;t=mt;}}
  return{t,d:best};}

/* ---------- ИИ ---------- */
function moveTo(e,tx,ty,spd,dt){const d=dist(e.x,e.y,tx,ty);
  if(d<6)return;const a=Math.atan2(ty-e.y,tx-e.x);
  e.x+=Math.cos(a)*spd*dt;e.y+=Math.sin(a)*spd*dt;resolveColl(e);
  e.walk+=spd*dt*.06;e.moveA=a;
  e.aim=angLerp(e.aim,a,dt*4);}

function updMercs(dt){
  const seeBase=300*(1-night*.45)*(rain>.4?.85:1);
  for(const m of mercs){if(m.hp<=0)continue;
    m.flash=Math.max(0,m.flash-dt);m.thinkT-=dt;m.cool-=dt;m.losT-=dt;
    if(m.losT<=0){
      m.losT=.16+Math.random()*.12;m.tgt=null;let best=seeBase;
      if(!player.dead){const d=dist(m.x,m.y,player.x,player.y);
        if(d<best){const aTo=Math.atan2(player.y-m.y,player.x-m.x);
          if(m.state==='combat'||angDiff(m.aim,aTo)<1.15)
            if(los(m.x,m.y,player.x,player.y)){best=d;m.tgt=player;}}}
      for(const mt of mates){const d=dist(m.x,m.y,mt.x,mt.y);
        if(d<best){const aTo=Math.atan2(mt.y-m.y,mt.x-m.x);
          if(m.state==='combat'||angDiff(m.aim,aTo)<1.15)
            if(los(m.x,m.y,mt.x,mt.y)){best=d;m.tgt=mt;}}}
      m.seeP=!!m.tgt;}
    const tgt=m.tgt;
    if(m.seeP&&m.state!=='combat'){m.state='combat';m.alertT=.35;}
    if(m.state==='patrol'){
      if(m.thinkT<=0){m.thinkT=rand(2,4.5);
        if(Math.random()<.4){m.tx=m.home.x+rand(-160,160);m.ty=m.home.y+rand(-160,160);}
        else{m.tx=m.x;m.ty=m.y;}}
      moveTo(m,m.tx,m.ty,45,dt);
      if(tgt)m.aim=angLerp(m.aim,Math.atan2(tgt.y-m.y,tgt.x-m.x),.15);
    }else if(m.state==='combat'){
      if(!tgt){m.state='patrol';continue;}
      if(tgt.hp!==undefined&&tgt.hp<=0){m.tgt=null;m.state='search';m.thinkT=6;continue;}
      if(!m.seeP){m.alertT-=dt;if(m.alertT<=0){m.state='search';m.tx=tgt.x;m.ty=tgt.y;m.thinkT=6;}}
      const aTo=Math.atan2(tgt.y-m.y,tgt.x-m.x);
      const dp=dist(m.x,m.y,tgt.x,tgt.y);
      m.aim=angLerp(m.aim,aTo,dt*7);
      let mvx=0,mvy=0;
      if(dp>300){mvx=Math.cos(aTo);mvy=Math.sin(aTo);}
      else if(dp<160){mvx=-Math.cos(aTo);mvy=-Math.sin(aTo);}
      mvx+=Math.cos(aTo+Math.PI/2)*m.strafe*.6;mvy+=Math.sin(aTo+Math.PI/2)*m.strafe*.6;
      m.x+=mvx*68*dt;m.y+=mvy*68*dt;resolveColl(m);
      m.walk+=Math.hypot(mvx,mvy)*dt*6;m.moveA=Math.atan2(mvy,mvx);
      if(m.pause>0)m.pause-=dt;
      else if(m.cool<=0&&m.seeP&&angDiff(m.aim,aTo)<.25&&dp<270){
        const mz={x:m.x+Math.cos(m.aim)*24,y:m.y+Math.sin(m.aim)*24};
        const a=m.aim+(Math.random()-.5)*.26;
        bullets.push({x:mz.x,y:mz.y,vx:Math.cos(a)*720,vy:Math.sin(a)*720,life:1,side:'e',dmg:9});
        lights.push({x:mz.x,y:mz.y,r:100,t:.07,tl:.07});
        sfxFar('eshoot',m.x,m.y);m.burst--;
        if(m.burst<=0){m.burst=irand(3,6);m.pause=rand(.6,1.4);}
        m.cool=.14;}
    }else if(m.state==='search'){
      if(m.thinkT<=0)m.state='patrol';
      if(!m.seeP&&m.thinkT>4.5)m.thinkT=4.5;
      moveTo(m,m.tx,m.ty,80,dt);
      if(m.seeP){m.state='combat';m.alertT=.3;}}
  }
  if(shotFlag){shotFlag=false;
    for(const m of mercs)if(m.state==='patrol'&&dist(m.x,m.y,player.x,player.y)<550){
      m.state='search';m.tx=player.x;m.ty=player.y;m.thinkT=6;}}
}
let shotFlag=false;

function updDogs(dt){
  for(const d of dogs){
    d.cool-=dt;d.barkT-=dt;d.aggro=Math.max(0,d.aggro-dt);

const sepaTmp=[];
function separateActors(){
  const arr=sepaTmp;arr.length=0;
  if(!player.dead)arr.push(player);
  for(const mt of mates)arr.push(mt);
  for(const m of mercs)if(m.hp>0)arr.push(m);
  for(const d of dogs)arr.push(d);
  for(const f of flesh)if(f.hp>0)arr.push(f);
  for(const b of boars)if(b.hp>0)arr.push(b);
  for(const r of rats)arr.push(r);
  for(const n of neutrals)arr.push(n);
  for(const a of allies)if(!a.dead)arr.push(a);
  for(const bl of bloods)arr.push(bl);
  for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){
    const a=arr[i],b=arr[j];
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=(a.r+b.r)*.9;
    if(d<m&&d>0){const p=(m-d)/2,nx=dx/d*p,ny=dy/d*p;
      a.x-=nx;a.y-=ny;b.x+=nx;b.y+=ny;}
    else if(d===0){a.x+=m*.5;}}
  for(const a of arr)resolveColl(a);
}

function anomTouch(e,dt){
  for(const a of actAnoms){
    const d=dist(e.x,e.y,a.x,a.y);
    if(d<a.r){
      if(a.type==='tor'){const ang=Math.atan2(a.y-e.y,a.x-e.x);
        e.x+=Math.cos(ang)*160*dt;e.y+=Math.sin(ang)*160*dt;}
      if(e===player){
        if(a.type==='fire'&&a.act>0)damagePlayer(24,a.x,a.y);
        else if(a.type==='elec'&&a.zapT>0)damagePlayer(16,a.x,a.y);
        else if(a.type==='tor')damagePlayer(34*dt,a.x,a.y);
      }else{
        if(a.type==='fire'&&a.act>0)e.hp-=26;
        else if(a.type==='elec'&&a.zapT>0)e.hp-=18;
        else if(a.type==='tor')e.hp-=40*dt;}
    }else if(a.type==='tor'&&d<a.r*2.3){
      const ang=Math.atan2(a.y-e.y,a.x-e.x),pull=(1-d/(a.r*2.3))*130;
      e.x+=Math.cos(ang)*pull*dt;e.y+=Math.sin(ang)*pull*dt;}}
}

      else{
        for(let i=0;i<3;i++){const ang=rand(0,TAU),d=a.r*2.2;
          addPart(a.x+Math.cos(ang)*d,a.y+Math.sin(ang)*d,
          -Math.cos(ang)*180,-Math.sin(ang)*180,.7,2.5,'#8a8070',0);}}}
    if(!a.art){a.artT-=dt*(emission.phase==='active'?4:1);
      if(a.artT<=0){if(Math.random()<.7)a.art=ART_ANOM[a.type][irand(0,ART_ANOM[a.type].length-1)];
        a.artT=rand(90,150);}}}
}
function triggerAnomalyAt(x,y){
  for(const a of actAnoms){if(dist(x,y,a.x,a.y)<a.r+40){
    if(a.type==='fire'){a.act=.5;a.cd=Math.min(a.cd,.3);}
    else if(a.type==='elec'){a.zapT=.2;a.cd=Math.min(a.cd,.3);sfx('zap');}
    else{for(let i=0;i<10;i++){const ang=rand(0,TAU),d=rand(60,a.r*2.2);
      addPart(a.x+Math.cos(ang)*d,a.y+Math.sin(ang)*d,-Math.cos(ang)*220,-Math.sin(ang)*220,.6,2.5,'#9a9080',0);}
      sfx('burst');}
    return true;}}
  return false;}

/* ---------- ВЫБРОС ---------- */
function updEmission(dt){
  emission.t-=dt;
  if(emission.phase==='idle'&&emission.t<=0){emission.phase='warn';emission.t=35;sfx('siren');
    msg('СИДОРОВИЧ: Будет выброс! В лагерь или в любой дом!','#e0a458');}
  else if(emission.phase==='warn'&&emission.t<=0){emission.phase='active';emission.t=40;sfx('thunder');
    msg('ВЫБРОС! Аномалии бурлят!','#e06b58');}
  else if(emission.phase==='active'){
    if(Math.random()<dt*1.4){emission.flash=.5;sfx('thunder');}
    if(!isSafe(player.x,player.y))player.rads=Math.min(100,player.rads+4*dt);
    if(emission.t<=0){emission.phase='idle';emission.t=rand(300,420);
      for(const s of activeSecs)for(const a of s.anoms)
        if(Math.random()<.7&&!a.art)a.art=ART_ANOM[a.type][irand(0,ART_ANOM[a.type].length-1)];
      msg('Выброс прошёл. У аномалий поспел хабар.','#9fc98a');}}
  const target=emission.phase==='warn'?(1-emission.t/35)*.22:emission.phase==='active'?.34+Math.sin(time*3)*.05:0;
  emission.red=lerp(emission.red,target,dt*2);
  emission.flash=Math.max(0,emission.flash-dt*2);
}

function updPickups(dt){
  for(let i=pickups.length-1;i>=0;i--){const p=pickups[i];
    if(dist(p.x,p.y,player.x,player.y)<28){
      if(p.type==='money'){player.money+=p.v;stats.earned+=p.v;msg('+'+fmtMoney(p.v),'#9fc98a');sfx('money');}
      else if(p.type==='ammo'){player.ammo[p.ammo]+=p.v;msg('+'+p.v+' патронов ('+p.ammo+')','#cfd4c0');sfx('pickup');}
      else if(p.type==='med'){player.meds++;msg('Аптечка найдена','#cfd4c0');sfx('pickup');}
      pickups.splice(i,1);}}
  for(const s of activeSecs){const st=s.stash;if(!st)continue;
    if(dist(st.x,st.y,player.x,player.y)<30){
      const roll=Math.random();
      if(roll<.4){const v=irand(150,500);player.money+=v;stats.earned+=v;msg('Тайник: +'+fmtMoney(v),'#9fc98a');sfx('money');}
      else if(roll<.7){const am=['9x18','5.45','12к'][irand(0,2)],v=irand(15,40);
        player.ammo[am]+=v;msg('Тайник: +'+v+' ('+am+')','#cfd4c0');}
      else{player.meds++;player.pills++;msg('Тайник: аптечка и антирад','#cfd4c0');}
      sfx('pickup');s.stash=null;saveGame();}}
  for(const a of actAnoms){if(!a.art)continue;
    const ax=a.x+Math.cos(a.ph*.6)*a.r*.4,ay=a.y+Math.sin(a.ph*.6)*a.r*.4;
    if(dist(ax,ay,player.x,player.y)<24){

      msg('Артефакт: '+ARTS[a.art].name+' ('+ARTS[a.art].fx+')',ARTS[a.art].color);sfx('pickup');
      if(quest.active&&QUESTS[quest.i].type==='art')checkQuestMsg();}}
}

/* ---------- КВЕСТЫ / МАГАЗИН / СОХРАНЕНИЕ ---------- */
const QUESTS=[
  {type:'art',need:2,reward:1500,text:'Принести 2 артефакта'},
  {type:'kill',need:4,reward:1700,text:'Устранить 4 наёмника'},
  {type:'art',need:3,reward:2600,text:'Принести 3 артефакта'},
  {type:'kill',need:7,reward:3200,text:'Устранить 7 наёмников'},
  {type:'art',need:4,reward:4200,text:'Принести 4 артефакта'}];
const quest={i:0,cycle:0,active:false,progress:0};
function questReward(){return Math.floor(QUESTS[quest.i].reward*(1+quest.cycle*.35));}
function checkQuestMsg(){const q=QUESTS[quest.i];
  if(q.type==='kill'&&quest.progress>=q.need)msg('Задание выполнено. К Сидоровичу в бункер!','#e0c458');
  if(q.type==='art'&&player.artifacts.length>=q.need)msg('Хабар собран. Сидорович ждёт.','#e0c458');}
function completeQuest(){const q=QUESTS[quest.i];
  if(q.type==='art'){if(player.artifacts.length<q.need)return false;
    player.artifacts.splice(0,q.need);}
  else if(quest.progress<q.need)return false;
  player.money+=questReward();stats.earned+=questReward();
  msg('Сидорович: Держи '+fmtMoney(questReward())+'. Не пропей.','#9fc98a');sfx('quest');
  quest.i=(quest.i+1)%QUESTS.length;if(quest.i===0)quest.cycle++;quest.progress=0;saveGame();return true;}
function openShop(){shopOpen=true;
  if(!quest.active){quest.active=true;msg('Сидорович: Есть работёнка — глянь «ЗАДАНИЕ».','#e0a458');}
  sidLine=['Ну что, живой? Заходи, не стой в дверях.','Хабар есть? А то разговор короткий.',
    'Наёмники у костра — если кошелёк позволяет.',
    'В долине кровосос завёлся. Шкурку принесёшь — цену набавлю.'][irand(0,3)];}
const SID_LINES_GOODS=[
  {name:'Аптечка',desc:'+55 HP',price:320,cb:()=>{player.meds++;}},
  {name:'Антирад',desc:'сбрасывает счётчик',price:280,cb:()=>{player.pills++;}},
  {name:'Патроны 9x18',desc:'30 шт.',price:180,cb:()=>{player.ammo['9x18']+=30;}},
  {name:'Патроны 5.45',desc:'60 шт.',price:420,cb:()=>{player.ammo['5.45']+=60;}},
  {name:'Дробь 12к',desc:'20 шт.',price:300,cb:()=>{player.ammo['12к']+=20;}}];
function saveGame(){try{localStorage.setItem('zona_save',JSON.stringify({
  m:player.money,hp:player.hp,o:player.owned,mg:player.mags,am:player.ammo,
  ar:player.artifacts,med:player.meds,pil:player.pills,arm:player.armor,cur:player.cur,
  qi:quest.i,qc:quest.cycle,qa:quest.active,qp:quest.progress,st:stats,cyc:cycT,
  hr:HIRES.map(h=>{if(!h.hired)return -1;const mt=mates.find(m=>m.post===h);
    return mt?Math.round(mt.hp):-1;})}));hasSave=1;}catch(e){}}
function loadGame(){try{const s=JSON.parse(localStorage.getItem('zona_save'));if(!s)return;
  player.money=s.m;player.hp=s.hp;Object.assign(player.owned,s.o);Object.assign(player.mags,s.mg);
  Object.assign(player.ammo,s.am);player.artifacts=s.ar||[];player.meds=s.med;player.pills=s.pil;
  player.armor=s.arm||1;player.cur=s.cur||'pm';
  quest.i=s.qi||0;quest.cycle=s.qc||0;quest.active=!!s.qa;quest.progress=s.qp||0;
  Object.assign(stats,s.st||{});cycT=s.cyc||40;
  if(s.hr){mates.length=0;
    HIRES.forEach((h,i)=>{const v=s.hr[i];
      if(v>=0){h.hired=true;const mt=makeMate(h);mt.hp=clamp(v,1,mt.mhp);
        mt.x=player.x+rand(-40,40);mt.y=player.y+rand(-40,40);mates.push(mt);}});}
}catch(e){}}

function hireMerc(post){
  if(player.money<post.cost){msg('Нужно '+fmtMoney(post.cost)+'.','#d99a6b');return;}
  player.money-=post.cost;post.hired=true;
  mates.push(makeMate(post));sfx('buy');
  msg(post.name+': В деле. Прикрой спину.','#9fc98a');saveGame();}
function dismissMate(mt){
  mt.post.hired=false;mt.post.respawnT=0;
  mt.x=mt.post.x;mt.y=mt.post.y;
  const i=mates.indexOf(mt);if(i>=0)mates.splice(i,1);
  msg(mt.name+': Работаю... то есть, свободен.','#9aa58a');sfx('click');saveGame();}
function healMate(mt){
  const cost=250;
  if(player.money<cost||mt.hp>=mt.mhp)return;
  player.money-=cost;mt.hp=mt.mhp;sfx('buy');
  msg(mt.name+' перевязан.','#9fc98a');saveGame();}

function performInteract(){
  if(!interactTarget)return;
  if(interactTarget.type==='shop')openShop();
  else if(interactTarget.type==='hire')hireMerc(interactTarget.o);
  else if(interactTarget.type==='neutral')neutralTalk(interactTarget.o);}

/* КРОВОСОС — горбатый гуманоид с щупальцами у пасти (как в игре) */
function bloodBody(col,walk){
  const st=Math.sin(walk)*5;
  /* ноги — согнутые, звериная походка */
  ctx.strokeStyle='#4a5244';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-2,-6);ctx.quadraticCurveTo(-9,-9+st,-13,-6+st);
  ctx.moveTo(-2,6);ctx.quadraticCurveTo(-9,9-st,-13,6-st);
  ctx.stroke();
  /* длинные руки вперёд с когтями */
  const sw=Math.sin(time*6)*1.6;
  ctx.strokeStyle=col;ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(2,-9);ctx.quadraticCurveTo(11,-15,18,-12+sw);
  ctx.moveTo(2,9);ctx.quadraticCurveTo(11,15,18,12-sw);
  ctx.stroke();
  ctx.strokeStyle='#cfd4c0';ctx.lineWidth=1.8;
  ctx.beginPath();
  for(const s of[-1,1]){const hy=s*(12-sw);
    for(let c=0;c<3;c++){const ca=(c-1)*.35*s;
      ctx.moveTo(18,hy);ctx.lineTo(18+Math.cos(ca)*6-2,hy+Math.sin(ca)*6+s*2);}}
  ctx.stroke();
  /* горбатый торс: широкие плечи, узкий зад */
  ctx.fillStyle=col;
  ctx.beginPath();ctx.ellipse(-1,0,12,10,0,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.5;ctx.stroke();
  /* горб и позвоночные наросты */
  ctx.fillStyle='#565f52';
  ctx.beginPath();
  ctx.arc(-4,-7,3.4,0,TAU);ctx.arc(-8,-5,2.8,0,TAU);ctx.arc(-11,-2,2.2,0,TAU);
  ctx.fill();
  /* бугристая кожа — пятна */
  ctx.fillStyle='rgba(60,72,58,.7)';
  ctx.beginPath();
  ctx.arc(2,-4,2.2,0,TAU);ctx.arc(-2,4,2.6,0,TAU);ctx.arc(5,5,1.8,0,TAU);
  ctx.fill();
  /* опущенная вперёд голова */
  ctx.fillStyle=col;
  ctx.beginPath();ctx.ellipse(11,0,6.5,5.5,0,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.2;ctx.stroke();
  /* щупальца вокруг пасти — веером вперёд, шевелятся */
  ctx.strokeStyle=col;ctx.lineWidth=2.4;ctx.lineCap='round';
  for(let k=0;k<7;k++){
    const a0=(k-3)*.36+Math.sin(time*8+k*1.1)*.14;
    const bx=13,by=(k-3)*1.4;
    const tx=13+Math.cos(a0)*(8.5+Math.sin(time*8+k)*1.2),
          ty=by+Math.sin(a0)*(9+Math.cos(time*7+k*1.4)*1.2);
    ctx.beginPath();ctx.moveTo(bx,by);
    ctx.quadraticCurveTo(bx+Math.cos(a0)*4,by+Math.sin(a0)*4,tx,ty);ctx.stroke();}
  /* тусклые красные глаза-точки сквозь щупальца */
  ctx.fillStyle='rgba(200,60,40,.8)';
  ctx.beginPath();ctx.arc(13.5,-1.8,.9,0,TAU);ctx.arc(13.5,1.8,.9,0,TAU);ctx.fill();
}

/* ---------- НОВАЯ ЁЛКА: ярусы с провисающими ветвями и хвоей ---------- */
function pineTier(x,apex,halfW,base,col){
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(x,apex);
  ctx.quadraticCurveTo(x+halfW*.2,apex+(base-apex)*.55,x+halfW,base);
  ctx.quadraticCurveTo(x+halfW*.45,base+3,x,base+2.5);
  ctx.quadraticCurveTo(x-halfW*.45,base+3,x-halfW,base);
  ctx.quadraticCurveTo(x-halfW*.2,apex+(base-apex)*.55,x,apex);
  ctx.fill();
  /* хвоинки по краям яруса */
  ctx.strokeStyle=col;ctx.lineWidth=1.4;
  ctx.beginPath();
  for(const s of[-1,1])for(let k=0;k<3;k++){
    const t=.35+k*.25,ex=x+s*halfW*t,ey=apex+(base-apex)*t;
    ctx.moveTo(ex,ey);ctx.lineTo(ex+s*3.5,ey+3.5);}
  ctx.stroke();
}
function drawPine(t){
  const x=t.x,y=t.y,r=t.cr;
  const cols=['#3f5a30','#38512a','#314825','#2a3f20'];
  for(let i=0;i<4;i++){
    const apex=y-r*1.15+i*r*.42;
    const halfW=r*(.34+.23*i);
    const base=apex+r*.52;
    pineTier(x,apex,halfW,base,cols[i]);}
  /* подсветка солнечной стороны */
  ctx.globalAlpha=.2;ctx.fillStyle='#5f8048';
  ctx.beginPath();ctx.moveTo(x,y-r*1.15);
  ctx.quadraticCurveTo(x-r*.5,y-r*.2,x-r*.85,y+r*.55);
  ctx.quadraticCurveTo(x-r*.3,y+r*.2,x,y-r*.1);
  ctx.closePath();ctx.fill();
  ctx.globalAlpha=1;
}

      a.scorch.addColorStop(1,'rgba(0,0,0,0)');}

function drawAnoms(){
  for(const a of actAnoms){
    if(a.x<cam.x-200||a.x>cam.x+W+200||a.y<cam.y-200||a.y>cam.y+H+200)continue;

        a.grad.addColorStop(0,'rgba(10,8,6,.85)');a.grad.addColorStop(.6,'rgba(20,16,12,.4)');a.grad.addColorStop(1,'rgba(0,0,0,0)');}
      ctx.fillStyle=a.grad;ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,TAU);ctx.fill();
      ctx.strokeStyle='rgba(140,130,110,.4)';ctx.lineWidth=1.5;

    if(a.art){const art=ARTS[a.art];

/* ---------- HUD ---------- */
function segBar(x,y,w,h,frac,col,blink){
  ctx.strokeStyle='#39432e';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w,h);
  const segs=16,gap=2,sw=(w-4-(segs-1)*gap)/segs,fillN=clamp(frac,0,1)*segs;
  for(let i=0;i<segs;i++){
    const f=clamp(fillN-i,0,1);
    if(f<=0){ctx.fillStyle='#1a2016';}
    else{ctx.fillStyle=col;ctx.globalAlpha=blink!==undefined?blink*(f<1?f:1):f;}
    ctx.fillRect(x+2+i*(sw+gap),y+2,sw,h-4);
    ctx.globalAlpha=1;}
}
function corner(x,y,dx,dy){ctx.strokeStyle='#d8b25a';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x,y+8*dy);ctx.lineTo(x,y);ctx.lineTo(x+8*dx,y);ctx.stroke();}
function statPanel(px,py,pw){

  ctx.textAlign='right';ctx.fillStyle='#7c8570';ctx.font='700 8px "Courier New",monospace';

function radMark(cx,cy,r,alpha){
  ctx.save();ctx.translate(cx,cy);
  ctx.strokeStyle='rgba(216,178,90,'+alpha+')';ctx.lineWidth=1.5;
  for(let i=0;i<3;i++){const a0=i*TAU/3-Math.PI/2;
    ctx.beginPath();
    ctx.arc(0,0,r*.8,a0-.5,a0+.5);
    ctx.arc(0,0,r*.22,a0+.5,a0-.5,true);
    ctx.closePath();ctx.stroke();}
  ctx.beginPath();ctx.arc(0,0,r*.22,0,TAU);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.stroke();
  ctx.restore();
}

/* ---------- ОБНОВЛЕНИЕ ---------- */
function update(dt){
  time+=dt;cycT+=dt;frameN++;
  night=lightLevel();
  if(player.grace>0)player.grace-=dt;
  updateActiveSectors();
  actAnoms.length=0;
  for(const s of activeSecs)for(const a of s.anoms)actAnoms.push(a);
  updAnoms(dt);
  let vx=0,vy=0;
  if(keys.KeyW||keys.ArrowUp)vy-=1;if(keys.KeyS||keys.ArrowDown)vy+=1;
  if(keys.KeyA||keys.ArrowLeft)vx-=1;if(keys.KeyD||keys.ArrowRight)vx+=1;
  if(joyL.active){vx=joyL.x;vy=joyL.y;}
  const vl=Math.hypot(vx,vy);
  if(vl>1){vx/=vl;vy/=vl;}
  const wantSprint=vl>.1&&(
    keys.ShiftLeft||keys.ShiftRight||
    (isTouch&&joyL.active&&Math.hypot(joyL.x,joyL.y)>=.92));
  player.sprinting=false;
  if(wantSprint&&!player.winded&&player.stam>0){
    player.sprinting=true;player.stam-=26*dt;
    if(player.stam<=0){player.stam=0;player.winded=true;msg('Дыхание сбито. Отдохни.','#d99a6b');}}
  else{player.stam+=(vl>.1?9:16)*dt;
    if(player.stam>100)player.stam=100;
    if(player.winded&&player.stam>25)player.winded=false;}
  const b=playerBonus();
  const spd=(player.sprinting?232:140)*b.spd;
  player.x+=vx*spd*dt;player.y+=vy*spd*dt;
  resolveColl(player);
  if(vl>.1){player.walk+=spd*dt*.06;player.moveA=Math.atan2(vy,vx);}
  player.hidden=false;
  outer:for(const s of activeSecs)for(const bu of s.bushes)
    if(dist(player.x,player.y,bu.x,bu.y)<bu.r+6){player.hidden=true;break outer;}
  let shooting=false,aiming=false;
  if(isTouch){
    const rl=Math.hypot(joyR.x,joyR.y);
    if(rl>.15){player.aim=Math.atan2(joyR.y,joyR.x);aiming=true;shooting=rl>.4;}
  }else{
    shooting=mDown;aiming=mDown;
    if(aiming)player.aim=Math.atan2(my+cam.y-player.y,mx+cam.x-player.x);
  }
  if(!aiming&&!player.dead){
    if(vl>.1)player.aim=angLerp(player.aim,Math.atan2(vy,vx),dt*9);
    else if(!isTouch)player.aim=angLerp(player.aim,
      Math.atan2(my+cam.y-player.y,mx+cam.x-player.x),dt*6);}
  const w=WPN[player.cur];
  if(player.cool>0)player.cool-=dt;
  if(player.rel>0){player.rel-=dt;if(player.rel<=0)finishReload();}
  if(shooting&&!player.dead){
    if(w.auto||player.cool<=0){if(player.mags[player.cur]>0){shootPlayer();shotFlag=true;}
      else if(player.rel<=0)startReload();}}
  player.boltCd=Math.max(0,player.boltCd-dt);
  /* камера: на мобильных игрок строго в центре, на ПК — лёгкий сдвиг к мыши */
  let lx=0,ly=0;
  if(!isTouch){lx=(mx-W/2)*.12;ly=(my-H/2)*.12;}
  cam.x=clamp(player.x-W/2+lx,0,WORLD-W);
  cam.y=clamp(player.y-W/2+ly,0,WORLD-H);
  updBullets(dt);
  updMercs(dt);updDogs(dt);updFlesh(dt);updBoars(dt);updRats(dt);updBloods(dt);
  updBirds(dt);updMates(dt);updNeutrals(dt);updAllies(dt);
  for(const h of HIRES)if(!h.hired&&h.respawnT>0){h.respawnT-=dt;
    if(h.respawnT<=0)msg(h.name+' снова в лагере.','#9aa58a');}
  separateActors();
  anomTouch(player,dt);
  for(let i=mercs.length-1;i>=0;i--){const m=mercs[i];anomTouch(m,dt);if(m.hp<=0)killMerc(m,false);}
  for(let i=dogs.length-1;i>=0;i--){const d=dogs[i];anomTouch(d,dt);if(d.hp<=0)killDog(d);}
  for(let i=flesh.length-1;i>=0;i--){const f=flesh[i];anomTouch(f,dt);if(f.hp<=0)killFlesh(f);}
  for(let i=boars.length-1;i>=0;i--){const bo=boars[i];anomTouch(bo,dt);if(bo.hp<=0)killBoar(bo);}
  for(let i=rats.length-1;i>=0;i--){const r=rats[i];anomTouch(r,dt);if(r.hp<=0)killRat(r);}
  for(let i=bloods.length-1;i>=0;i--){const bl=bloods[i];anomTouch(bl,dt);if(bl.hp<=0)killBlood(bl);}
  for(let i=mates.length-1;i>=0;i--){const mt=mates[i];anomTouch(mt,dt);if(mt.hp<=0)killMate(mt);}
  for(const a of allies){if(!a.dead){anomTouch(a,dt);if(a.hp<=0){a.dead=true;a.deadT=340;
    addDecal(a.x,a.y,13,'rgba(70,16,12,.45)',30);
    msg(a.name+' сгинул в аномалии.','#d98a6b');}}}
  updEmission(dt);updWeather(dt);updPickups(dt);
  let rate=0;
  for(const s of radSpots)if(dist(player.x,player.y,s.x,s.y)<s.r)rate=Math.max(rate,s.rate);
  if(emission.phase==='active'&&!isSafe(player.x,player.y))rate+=4;
  if(rate>0){player.rads=Math.min(100,player.rads+rate*dt);
    if(Math.random()<rate*dt*.9)sfx('geiger');
    if(player.rads>80&&Math.random()<dt)msg('Счётчик трещит! Антирад!','#d9c94a');}
  if(player.rads>=100)damagePlayer(4*dt);
  player.rads=Math.max(0,player.rads-dt*.4);
  if(b.regen>0)player.hp=Math.min(player.maxHp,player.hp+b.regen*dt);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
  for(let i=lights.length-1;i>=0;i--){lights[i].t-=dt;if(lights[i].t<=0)lights.splice(i,1);}
  for(let i=decals.length-1;i>=0;i--){decals[i].life-=dt;if(decals[i].life<=0)decals.splice(i,1);}
  for(let i=bolts.length-1;i>=0;i--){const bo=bolts[i];bo.t+=dt*2.2;
    if(bo.t>=1){triggerAnomalyAt(bo.tx,bo.ty);bolts.splice(i,1);}}
  shake=Math.max(0,shake-dt*14);dmgFlash=Math.max(0,dmgFlash-dt*2);
  for(let i=msgs.length-1;i>=0;i--){msgs[i].t-=dt;if(msgs[i].t<=0)msgs.splice(i,1);}
  if(Math.random()<.5)addPart(FIRE_PIT.x+rand(-5,5),FIRE_PIT.y+rand(-3,3),rand(-8,8),rand(-45,-25),
    rand(.4,.9),rand(2,4),Math.random()<.5?'#ff9a3d':'#e8762a',-20);
  if(dist(player.x,player.y,SID.x,SID.y)<900&&Math.random()<dt*2.4)
    addPart(SID.x+rand(-2,4),SID.y-6,rand(-5,5),rand(-20,-10),rand(1.2,2.2),rand(2,3.5),'rgba(190,190,185,.3)',-6);
  updSpawns(dt);
  interactTarget=null;let bd=1e9;
  const cons=(x,y,r,obj,type)=>{const d=dist(player.x,player.y,x,y);
    if(d<r&&d<bd){bd=d;interactTarget={type,o:obj};}};
  cons(SID.x,SID.y,110,SID,'shop');
  for(const h of HIRES)if(!h.hired&&h.respawnT<=0)cons(h.x,h.y,90,h,'hire');
  for(const n of neutrals)cons(n.x,n.y,130,n,'neutral');
  saveT+=dt;if(saveT>25){saveT=0;saveGame();}
}

/* ---------- РЕНДЕР МИРА ---------- */
function drawFloraGround(){
  for(const s of activeSecs){
    for(const p of s.grass){
      if(p.x<cam.x-90||p.x>cam.x+W+90||p.y<cam.y-70||p.y>cam.y+H+70)continue;
      const sw=Math.sin(time*1.6+p.ph)*2.2;
      ctx.strokeStyle='#3c4429';ctx.lineWidth=1.6;
      ctx.beginPath();
      for(const bl of p.bl){const x=p.x+bl.dx,y=p.y+bl.dy;
        ctx.moveTo(x,y);ctx.quadraticCurveTo(x+bl.a*4,y-bl.l*.6,x+bl.a*6+sw,y-bl.l);}
      ctx.stroke();}
    for(const f of s.flowers){
      if(f.x<cam.x-60||f.x>cam.x+W+60||f.y<cam.y-50||f.y>cam.y+H+50)continue;
      for(const pt of f.pts){ctx.fillStyle=pt.c;
        ctx.beginPath();ctx.arc(f.x+pt.dx,f.y+pt.dy,1.7,0,TAU);ctx.fill();}}
    for(const m of s.mush){
      if(m.x<cam.x-40||m.x>cam.x+W+40||m.y<cam.y-40||m.y>cam.y+H+40)continue;
      ctx.fillStyle='#cfc4a8';ctx.fillRect(m.x-1.2,m.y-2,2.4,3);
      ctx.fillStyle=m.c;ctx.beginPath();ctx.arc(m.x,m.y-2.4,2.6,Math.PI,0);ctx.fill();}
    for(const p of s.pebbles){
      if(p.x<cam.x-40||p.x>cam.x+W+40||p.y<cam.y-40||p.y>cam.y+H+40)continue;
      ctx.fillStyle='#716e64';
      for(let k=0;k<p.n;k++){ctx.beginPath();ctx.arc(p.x+k*5-4,p.y+(k%2)*3,2.2,0,TAU);ctx.fill();}}
    for(const st of s.stumps){
      if(st.x<cam.x-50||st.x>cam.x+W+50||st.y<cam.y-50||st.y>cam.y+H+50)continue;
      ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(st.x+2,st.y+3,st.r,st.r*.6,0,0,TAU);ctx.fill();
      ctx.fillStyle='#6b5638';ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,TAU);ctx.fill();
      ctx.strokeStyle='#57452c';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(st.x,st.y,st.r*.6,0,TAU);ctx.stroke();
      ctx.fillStyle='#57452c';ctx.beginPath();ctx.arc(st.x,st.y,st.r*.25,0,TAU);ctx.fill();}
    for(const L of s.logs){
      if(L.x<cam.x-90||L.x>cam.x+W+90||L.y<cam.y-70||L.y>cam.y+H+70)continue;
      ctx.save();ctx.translate(L.x,L.y);ctx.rotate(L.a);
      ctx.fillStyle='rgba(0,0,0,.22)';rr(-L.len/2,-5,L.len,15,7);ctx.fill();
      ctx.fillStyle='#5d4a33';rr(-L.len/2,-7,L.len,14,7);ctx.fill();
      ctx.strokeStyle='#4a3a26';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(-L.len/2+6,-4);ctx.lineTo(L.len/2-6,-4);
      ctx.moveTo(-L.len/2+8,2);ctx.lineTo(L.len/2-4,2);ctx.stroke();
      ctx.fillStyle='#7a6547';ctx.beginPath();ctx.ellipse(L.len/2-3,0,3.5,6.4,0,0,TAU);ctx.fill();
      ctx.strokeStyle='#5d4a33';ctx.beginPath();ctx.ellipse(L.len/2-3,0,1.8,3.4,0,0,TAU);ctx.stroke();
      ctx.restore();}
    for(const w of lowWalls){
      if(w[0]+w[2]<cam.x-40||w[0]>cam.x+W+40||w[1]+w[3]<cam.y-40||w[1]>cam.y+H+40)continue;
      ctx.fillStyle='#8a7d5c';ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;
      if(w[2]>=w[3]){const n=Math.max(2,Math.round(w[2]/14));
        for(let k=0;k<n;k++){const x=w[0]+7+k*(w[2]-14)/(n-1);
          for(let row=0;row<2;row++){ctx.beginPath();
            ctx.ellipse(x,w[1]+4+row*7,8,5,0,0,TAU);ctx.fill();ctx.stroke();}}}
      else{const n=Math.max(2,Math.round(w[3]/12));
        for(let k=0;k<n;k++){const y=w[1]+6+k*(w[3]-12)/(n-1);
          for(let col=0;col<2;col++){ctx.beginPath();
            ctx.ellipse(w[0]+3+col*8,y,5,7,0,0,TAU);ctx.fill();ctx.stroke();}}}}
  }
}
function tri(x,yb,hw,ht){ctx.beginPath();ctx.moveTo(x,yb-ht);ctx.lineTo(x-hw,yb);ctx.lineTo(x+hw,yb);ctx.closePath();ctx.fill();}
function drawCrowns(){
  for(const s of activeSecs){
    for(const t of s.trees){
      if(t.x<cam.x-80||t.x>cam.x+W+80||t.y<cam.y-90||t.y>cam.y+H+70)continue;
      ctx.globalAlpha=.9;
      if(t.pine){drawPine(t);}
      else{
        ctx.fillStyle='#2c3823';ctx.beginPath();ctx.arc(t.x+2,t.y+3,t.cr,0,TAU);ctx.fill();
        ctx.fillStyle='#37452a';ctx.beginPath();ctx.arc(t.x-t.cr*.2+t.dx*.4,t.y-t.cr*.2+t.dy*.4,t.cr*.72,0,TAU);ctx.fill();
        ctx.fillStyle='#415030';ctx.beginPath();ctx.arc(t.x-t.cr*.28+t.dx2,t.y-t.cr*.28+t.dy2,t.cr*.38,0,TAU);ctx.fill();}
      ctx.globalAlpha=1;}
    for(const bu of s.bushes){
      if(bu.x<cam.x-60||bu.x>cam.x+W+60||bu.y<cam.y-60||bu.y>cam.y+H+60)continue;
      ctx.globalAlpha=.94;
      ctx.fillStyle='#2f4022';
      ctx.beginPath();ctx.arc(bu.x,bu.y,bu.r,0,TAU);
      ctx.arc(bu.x+bu.r*.55,bu.y+bu.r*.25,bu.r*.66,0,TAU);

function drawWalls(b,fill,stroke){

  const T=b.T,dw=b.dw,{x,y,w,h}=b;
  ctx.fillStyle='rgba(120,110,85,.5)';
  if(b.door==='s')ctx.fillRect(x+(w-dw)/2,y+h-T-4,dw,T+8);
  else if(b.door==='n')ctx.fillRect(x+(w-dw)/2,y-4,dw,T+8);
  else if(b.door==='e')ctx.fillRect(x+w-T-4,y+(h-dw)/2,T+8,dw);

function drawOpenBuilding(b){

  else for(let xx=x+T+7;xx<x+w-T;xx+=11){ctx.moveTo(xx,y+T);ctx.lineTo(xx,y+h-T);}
  ctx.stroke();
  const rng=mulberry32(((b.x*7919)^(b.y*104729))|0);
  ctx.fillStyle='#5a4a38';rr(x+T+6,y+T+6,26,40,4);ctx.fill();

  ctx.fillStyle='#6a5a44';rr(x+T+9,y+T+25,20,18,2);ctx.fill();

  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.stroke();

}

    else if(it.k===13){const a=it.o;
      drawHuman(a.x,a.y,a.aim,a.walk,a.moveA,'#3f4a38','#9a7a52',18,a.flash>0?1:0,true);
      if(dist(a.x,a.y,player.x,player.y)<260)
        label(a.x,a.y-24,a.name+(a.gifted?' · союзник':' · подходи'),'#a8c49a');}
    else if(it.k===14)drawSitter(it.o.s,it.o.i);
    else if(it.k===5){const f=WPN[player.cur];
      drawHuman(player.x,player.y,player.aim,player.walk,player.moveA,'#5d5643','#33302a',f.len,player.cool>f.rof-.05?1:0,true);
      if(player.hidden){ctx.strokeStyle='rgba(140,190,110,.5)';ctx.lineWidth=1.5;
        ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(player.x,player.y,20,0,TAU);ctx.stroke();ctx.setLineDash([]);}}
  }
  ctx.lineWidth=2;
  for(const b2 of bullets){
    ctx.strokeStyle=b2.side==='p'?'rgba(255,230,160,.85)':b2.side==='m'?'rgba(200,255,180,.85)':'rgba(255,150,120,.85)';
    ctx.beginPath();ctx.moveTo(b2.x,b2.y);ctx.lineTo(b2.x-b2.vx*.014,b2.y-b2.vy*.014);ctx.stroke();}
  for(const bo of bolts){const t=Math.min(bo.t,1);
    const x=lerp(bo.sx,bo.tx,t),y=lerp(bo.sy,bo.ty,t)-Math.sin(t*Math.PI)*36;
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();
    ctx.ellipse(lerp(bo.sx,bo.tx,t),lerp(bo.sy,bo.ty,t)+4,4,2,0,0,TAU);ctx.fill();
    ctx.save();ctx.translate(x,y);ctx.rotate(bo.ang+bo.t*9);
    ctx.fillStyle='#8f8b80';ctx.beginPath();
    for(let i=0;i<6;i++){const a=i/6*TAU;i?ctx.lineTo(Math.cos(a)*4.5,Math.sin(a)*4.5):ctx.moveTo(4.5,0);}
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#3a382f';ctx.beginPath();ctx.arc(0,0,1.8,0,TAU);ctx.fill();ctx.restore();}
  if(BASE.x+BASE.w>cam.x-100&&BASE.x<cam.x+W+100&&BASE.y+BASE.h>cam.y-100&&BASE.y<cam.y+H+100){
    ctx.lineWidth=3;
    for(const f of FENCE){
      if(f[3]<=14){ctx.strokeStyle='#4a3d2c';
        ctx.beginPath();ctx.moveTo(f[0],f[1]+4);ctx.lineTo(f[0]+f[2],f[1]+4);
        ctx.moveTo(f[0],f[1]+9);ctx.lineTo(f[0]+f[2],f[1]+9);ctx.stroke();
        ctx.fillStyle='#5d4d36';
        for(let px2=f[0];px2<=f[0]+f[2];px2+=40)ctx.fillRect(px2-3,f[1]-4,6,20);
      }else{ctx.strokeStyle='#4a3d2c';
        ctx.beginPath();ctx.moveTo(f[0]+4,f[1]);ctx.lineTo(f[0]+4,f[1]+f[3]);
        ctx.moveTo(f[0]+9,f[1]);ctx.lineTo(f[0]+9,f[1]+f[3]);ctx.stroke();
        ctx.fillStyle='#5d4d36';
        for(let py2=f[1];py2<=f[1]+f[3];py2+=40)ctx.fillRect(f[0]-4,py2-3,20,6);}}
    ctx.fillStyle='#6b5a40';ctx.fillRect(592,6858,20,34);ctx.fillRect(668,6858,20,34);
    ctx.fillStyle='#7d6a4c';ctx.fillRect(588,6854,28,8);ctx.fillRect(664,6854,28,8);
    ctx.fillStyle='#4a3d2c';ctx.fillRect(556,6828,168,24);
    ctx.strokeStyle='#2e2519';ctx.lineWidth=2;ctx.strokeRect(556,6828,168,24);
    label(640,6844,'ЛАГЕРЬ СТАЛКЕРОВ','#d8cf9f');}
  drawCrowns();
  for(const b2 of birds)if(vis(b2))drawBird(b2);
  drawAnoms();
  for(const p of parts){ctx.globalAlpha=p.fade?clamp(p.life/p.tl,0,1):1;
    ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}
  ctx.globalAlpha=1;
  ctx.restore();
  drawLighting();
  if(rain>.05){ctx.strokeStyle='rgba(180,200,220,'+(rain*.4)+')';ctx.lineWidth=1;
    ctx.beginPath();
    for(const d of drops){d.y+=d.s*.02;d.x+=.004;
      if(d.y>1){d.y-=1;d.x=Math.random();}if(d.x>1)d.x-=1;
      const x=d.x*W,y=d.y*H;
      ctx.moveTo(x,y);ctx.lineTo(x-4,y+13);}
    ctx.stroke();}
}

/* ---------- ГЛАВНЫЙ ЦИКЛ ---------- */
let last=performance.now(),fpsE=60,qCool=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000;last=now;
  if(dt>0.05)dt=0.05;
  fpsE=lerp(fpsE,1/Math.max(dt,.001),.05);qCool-=dt;
  if(qCool<=0){if(fpsE<42&&quality<2){quality++;resize();qCool=6;}
    else if(fpsE>57&&quality>0){quality--;resize();qCool=10;}else qCool=2;}
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(state==='intro'){drawIntro();return;}
  if(state==='dead'){drawDead();return;}
  update(dt);
  drawWorld();
  drawHUD();
  if(shopOpen)drawShop();
  else if(bagOpen)drawBag();
}

/* ---------- СТАРТ ---------- */
let hasSave=-1;
function refreshHasSave(){try{hasSave=localStorage.getItem('zona_save')?1:0;}catch(e){hasSave=0;}}
readSafe();resize();genWorld();
for(const d of EXTRA_ANOMS)sectors[secOf(d.x,d.y)].extra.push(mkAnom(d.type,d.x,d.y));
buildMinimap();loadGame();
requestAnimationFrame(loop);
</script>
