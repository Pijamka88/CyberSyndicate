<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Voxel Echoes — Reflective Isometric Fantasy</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0a0a12; font-family: 'Segoe UI', system-ui, sans-serif; }
    #info {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 20, 0.75);
      backdrop-filter: blur(8px);
      color: #dcc8a0;
      padding: 10px 22px;
      border-radius: 40px;
      letter-spacing: 1px;
      font-size: 14px;
      pointer-events: none;
      border: 1px solid rgba(220, 200, 160, 0.3);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 10;
    }
    #title {
      position: absolute;
      top: 20px;
      left: 30px;
      color: #efe6d2;
      font-weight: 300;
      text-shadow: 0 4px 12px rgba(0,0,0,0.6);
      pointer-events: none;
      font-size: 22px;
      letter-spacing: 3px;
      z-index: 10;
    }
    #title span {
      color: #b89a6a;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="title">⚔️ VOXEL<span>ECHOES</span></div>
  <div id="info">CLICK GROUND TO MOVE • DRAG TO ROTATE • SCROLL TO ZOOM</div>

  <!-- Import Three.js core and addons from CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Reflector } from 'three/addons/objects/Reflector.js';

    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a14);
    scene.fog = new THREE.FogExp2(0x0a0a14, 0.035);

    // Renderer with performance settings
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    // --- CAMERA (Isometric-ish, orbital for lazy follow) ---
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(15, 18, 18); // elevated isometric view

    // --- ORBIT CONTROLS (drag to rotate, scroll to zoom) ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.5, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 8;
    controls.maxDistance = 28;
    controls.maxPolarAngle = Math.PI / 2.4; // keep above ground
    controls.minPolarAngle = 0.3;
    controls.autoRotate = false;
    controls.update();

    // --- LIGHTS (moody, elden ring vibes) ---
    const ambientLight = new THREE.AmbientLight(0x3a2f3f, 0.9);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xe8d5b8, 1.2);
    mainLight.position.set(12, 20, 8);
    mainLight.castShadow = true;
    mainLight.receiveShadow = true;
    mainLight.shadow.mapSize.width = 1024;
    mainLight.shadow.mapSize.height = 1024;
    mainLight.shadow.camera.near = 0.5;
    mainLight.shadow.camera.far = 60;
    mainLight.shadow.camera.left = -20;
    mainLight.shadow.camera.right = 20;
    mainLight.shadow.camera.top = 20;
    mainLight.shadow.camera.bottom = -20;
    mainLight.shadow.bias = -0.0005;
    scene.add(mainLight);

    const rimLight = new THREE.PointLight(0x7a5c9e, 1.0, 30);
    rimLight.position.set(-6, 8, -8);
    scene.add(rimLight);

    const fillLight = new THREE.PointLight(0x4a6a8a, 0.7, 25);
    fillLight.position.set(5, 6, 10);
    scene.add(fillLight);

    // --- REFLECTIVE WET FLOOR (Reflector) ---
    const floorWidth = 45;
    const floorDepth = 45;
    const reflectorFloor = new Reflector(
      new THREE.PlaneGeometry(floorWidth, floorDepth),
      {
        clipBias: 0.003,
        textureWidth: window.innerWidth * 0.6,
        textureHeight: window.innerHeight * 0.6,
        color: 0xaab0c0,
        recursive: true
      }
    );
    reflectorFloor.rotation.x = -Math.PI / 2;
    reflectorFloor.position.y = 0.01;
    reflectorFloor.receiveShadow = true;
    scene.add(reflectorFloor);

    // subtle grid / texture overlay on floor to fake voxel grid
    const gridHelper = new THREE.GridHelper(floorWidth, 30, 0x887766, 0x443a33);
    gridHelper.position.y = 0.02;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.18;
    scene.add(gridHelper);

    // --- VOXEL STYLE ENVIRONMENT (built from boxes) ---
    const voxelGroup = new THREE.Group();
    scene.add(voxelGroup);

    function addVoxel(x, y, z, w, h, d, color, roughness = 0.7, metalness = 0.1) {
      const geometry = new THREE.BoxGeometry(w, h, d);
      const material = new THREE.MeshStandardMaterial({
        color: color,
        roughness: roughness,
        metalness: metalness,
        emissive: new THREE.Color(0x000000)
      });
      const cube = new THREE.Mesh(geometry, material);
      cube.position.set(x, y + h/2, z);
      cube.castShadow = true;
      cube.receiveShadow = true;
      voxelGroup.add(cube);
      return cube;
    }

    // --- Ancient ruins and terrain features ---
    // Central dais
    addVoxel(0, 0, 0, 5, 0.6, 5, 0x5a4e42);
    addVoxel(0, 0.6, 0, 4, 0.3, 4, 0x6b5f53);
    
    // Fallen pillars
    addVoxel(-4, 0.5, -4, 1.2, 3.5, 1.2, 0x7a6a5a, 0.5, 0.2);
    addVoxel(-4, 4.0, -4, 1.5, 0.8, 1.5, 0x8a7a6a, 0.4, 0.1);
    addVoxel(5.5, 0.5, -3, 1.0, 4.5, 1.0, 0x6e5e4e, 0.6, 0.2);
    addVoxel(5.5, 5.0, -3, 1.4, 0.7, 1.4, 0x807060, 0.5, 0.1);
    
    // Broken archway pieces
    addVoxel(-2.5, 0.5, -6, 1.5, 2.8, 1.5, 0x65584c);
    addVoxel(3, 0.8, -5.5, 1.8, 3.0, 1.2, 0x5c4f42);
    addVoxel(0.2, 0.4, -7, 2.2, 1.5, 1.0, 0x776854);
    
    // Rune stones and small crystals (glowing)
    const crystalMat = new THREE.MeshStandardMaterial({ color: 0x9a8ae0, emissive: 0x3a2a6a, roughness: 0.2, metalness: 0.3 });
    const crystalGeo = new THREE.BoxGeometry(0.6, 1.6, 0.6);
    const crystalPositions = [
      [2.5, 0.8, 2.8], [-3.2, 0.9, -2.5], [4.0, 0.7, -4.0], [-1.5, 0.9, 5.0]
    ];
    crystalPositions.forEach(pos => {
      const crystal = new THREE.Mesh(crystalGeo, crystalMat);
      crystal.position.set(pos[0], pos[1], pos[2]);
      crystal.castShadow = true;
      crystal.receiveShadow = true;
      voxelGroup.add(crystal);
    });

    // Mossy boulders (voxel blobs)
    addVoxel(-5, 0.3, 3, 2.2, 1.8, 2.2, 0x4a5a3a);
    addVoxel(7, 0.4, 4, 1.8, 2.0, 2.5, 0x3f4f32);
    addVoxel(6, 0.2, -5.5, 2.0, 1.5, 1.5, 0x556b2f);
    
    // Giant tree-like voxel structure (fantasy beacon)
    addVoxel(-7, 0, -7, 2.0, 6.0, 2.0, 0x4e3c2a);
    addVoxel(-7, 6, -7, 4.0, 1.2, 4.0, 0x3c2f1e);
    addVoxel(-7, 7.2, -7, 2.8, 1.0, 2.8, 0x5a4530);
    
    // Floating glowing orbs (environment life)
    const orbGroup = new THREE.Group();
    scene.add(orbGroup);
    const orbMat = new THREE.MeshStandardMaterial({ color: 0xffbb77, emissive: 0x553311, roughness: 0.1, metalness: 0.5 });
    for (let i = 0; i < 12; i++) {
      const orbGeo = new THREE.SphereGeometry(0.15 + Math.random()*0.2, 6, 6);
      const orb = new THREE.Mesh(orbGeo, orbMat);
      orb.castShadow = true;
      orb.position.set(
        (Math.random() - 0.5) * 16,
        1.5 + Math.random() * 5,
        (Math.random() - 0.5) * 16
      );
      orb.userData = { baseY: orb.position.y, speed: 0.5 + Math.random() * 1.5, offset: Math.random() * 10 };
      orbGroup.add(orb);
    }

    // --- CHARACTER (voxel knight-ish) ---
    const characterGroup = new THREE.Group();
    scene.add(characterGroup);
    
    // Body
    const bodyGeo = new THREE.BoxGeometry(0.9, 1.2, 0.6);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a3f4a, roughness: 0.5, metalness: 0.3 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.9;
    body.castShadow = true;
    body.receiveShadow = true;
    characterGroup.add(body);
    
    // Head
    const headGeo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xd8c0a8, roughness: 0.6 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.85;
    head.castShadow = true;
    head.receiveShadow = true;
    characterGroup.add(head);
    
    // Helmet visor
    const visorGeo = new THREE.BoxGeometry(0.75, 0.2, 0.25);
    const visorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.2, metalness: 0.8 });
    const visor = new THREE.Mesh(visorGeo, visorMat);
    visor.position.set(0, 1.85, 0.36);
    visor.castShadow = true;
    characterGroup.add(visor);
    
    // Arms
    const armGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
    const armMat = new THREE.MeshStandardMaterial({ color: 0x3a323a, roughness: 0.5 });
    const leftArm = new THREE.Mesh(armGeo, armMat);
    leftArm.position.set(-0.6, 1.15, 0);
    leftArm.castShadow = true;
    characterGroup.add(leftArm);
    const rightArm = new THREE.Mesh(armGeo, armMat);
    rightArm.position.set(0.6, 1.15, 0);
    rightArm.castShadow = true;
    characterGroup.add(rightArm);
    
    // Legs
    const legGeo = new THREE.BoxGeometry(0.35, 0.8, 0.35);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x2c2a2c, roughness: 0.4, metalness: 0.2 });
    const leftLeg = new THREE.Mesh(legGeo, legMat);
    leftLeg.position.set(-0.25, 0.4, 0);
    leftLeg.castShadow = true;
    characterGroup.add(leftLeg);
    const rightLeg = new THREE.Mesh(legGeo, legMat);
    rightLeg.position.set(0.25, 0.4, 0);
    rightLeg.castShadow = true;
    characterGroup.add(rightLeg);
    
    // Cape (voxel)
    const capeGeo = new THREE.BoxGeometry(0.9, 1.0, 0.2);
    const capeMat = new THREE.MeshStandardMaterial({ color: 0x5c2e2e, roughness: 0.8 });
    const cape = new THREE.Mesh(capeGeo, capeMat);
    cape.position.set(0, 0.9, -0.4);
    cape.castShadow = true;
    characterGroup.add(cape);
    
    // Starting position
    characterGroup.position.set(0, 0, 2.5);
    
    // Movement target
    let targetPosition = new THREE.Vector3(0, 0, 2.5);
    const moveSpeed = 0.08;
    
    // --- CLICK TO MOVE (raycast to floor) ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    
    window.addEventListener('click', (event) => {
      // Calculate mouse position in normalized device coordinates
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(reflectorFloor);
      
      if (intersects.length > 0) {
        const point = intersects[0].point;
        // Clamp movement to limited space (radius ~13)
        const dx = point.x;
        const dz = point.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        if (dist < 13) {
          targetPosition.set(dx, 0, dz);
        } else {
          // clamp to edge
          const angle = Math.atan2(dz, dx);
          targetPosition.set(Math.cos(angle)*12.5, 0, Math.sin(angle)*12.5);
        }
      }
    });
    
    // --- CAMERA LAZY FOLLOW (in animation loop) ---
    
    // --- ENVIRONMENT ANIMATION (orbs, crystals pulse, etc) ---
    const clock = new THREE.Clock();
    
    // Store crystal materials for pulsing
    const crystalMats = [];
    scene.traverse(obj => {
      if (obj.isMesh && obj.material && obj.material.emissive && obj.material.emissive.getHex() === 0x3a2a6a) {
        crystalMats.push(obj.material);
      }
    });
    
    // --- ANIMATION LOOP ---
    function animate() {
      const delta = clock.getDelta();
      const elapsedTime = performance.now() * 0.001;
      
      // Lazy follow: character moves toward target
      const currentPos = characterGroup.position.clone();
      const direction = new THREE.Vector3(
        targetPosition.x - currentPos.x,
        0,
        targetPosition.z - currentPos.z
      );
      const distance = direction.length();
      
      if (distance > 0.1) {
        direction.normalize();
        const step = Math.min(moveSpeed, distance);
        characterGroup.position.x += direction.x * step;
        characterGroup.position.z += direction.z * step;
        
        // Simple rotation to face movement direction
        if (direction.length() > 0.01) {
          const angle = Math.atan2(direction.x, direction.z);
          characterGroup.rotation.y = angle;
        }
      }
      
      // Subtle idle bob for character
      if (distance <= 0.1) {
        characterGroup.position.y = Math.sin(elapsedTime * 2.5) * 0.03;
        characterGroup.rotation.y += Math.sin(elapsedTime * 0.8) * 0.002;
      } else {
        characterGroup.position.y = 0;
      }
      
      // Animate floating orbs
      orbGroup.children.forEach((orb, index) => {
        const data = orb.userData;
        if (data.baseY !== undefined) {
          orb.position.y = data.baseY + Math.sin(elapsedTime * data.speed + data.offset) * 0.7;
          orb.rotation.x += 0.01;
          orb.rotation.z += 0.02;
        }
      });
      
      // Pulse crystals
      crystalMats.forEach(mat => {
        const pulse = 0.8 + Math.sin(elapsedTime * 2.0) * 0.4;
        mat.emissiveIntensity = pulse;
      });
      
      // Camera lazy follow: orbit target moves toward character smoothly
      const desiredTarget = new THREE.Vector3(characterGroup.position.x, 1.6, characterGroup.position.z);
      controls.target.lerp(desiredTarget, 0.05);
      
      // Update controls
      controls.update();
      
      // Render
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    
    // Start animation
    animate();
    
    // --- RESIZE HANDLER ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- INITIAL TARGET SET ---
    targetPosition.set(0, 0, 2.5);
    
    console.log('⚔️ Voxel Echoes ready — click to move, drag to rotate.');
  </script>
</body>
</html>
