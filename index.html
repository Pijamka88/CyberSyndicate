<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Isometric Voxel Fantasy · Wet Floor</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #info {
      position: absolute; bottom: 20px; left: 20px; color: #ccd; 
      background: rgba(10,10,20,0.5); padding: 8px 16px; border-radius: 40px;
      backdrop-filter: blur(4px); pointer-events: none; font-size: 14px;
      border: 1px solid #4a4a6a;
    }
    #info i { font-style: normal; display: inline-block; margin: 0 6px; }
    #controls-hint {
      position: absolute; bottom: 20px; right: 20px; color: #aab;
      background: rgba(0,0,0,0.4); padding: 10px 14px; border-radius: 30px;
      font-size: 13px; backdrop-filter: blur(3px); border: 1px solid #3a3a5a;
      pointer-events: none; text-align: right; line-height: 1.6;
    }
    canvas { display: block; }
    @media (max-width: 600px) {
      #controls-hint { display: none; }
      #info { font-size: 12px; bottom: 12px; left: 12px; }
    }
  </style>
</head>
<body>
  <div id="info">🗡️ FANTASY · <span id="pos-indicator">standing still</span></div>
  <div id="controls-hint">🖱️ click → move<br>↔ drag → rotate<br>🔍 scroll → zoom</div>

  <!-- Import maps & Three.js from CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ---- setup scene ----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111a22);
    scene.fog = new THREE.Fog(0x111a22, 20, 50);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(12, 10, 14);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // ---- controls (orbit with lazy follow) ----
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.5, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.12;
    controls.maxPolarAngle = Math.PI / 2.2;
    controls.minDistance = 5;
    controls.maxDistance = 28;
    controls.update();

    // ---- lights ----
    const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    mainLight.position.set(8, 15, 5);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 1024;
    mainLight.shadow.mapSize.height = 1024;
    mainLight.shadow.camera.near = 0.5;
    mainLight.shadow.camera.far = 30;
    mainLight.shadow.camera.left = -15;
    mainLight.shadow.camera.right = 15;
    mainLight.shadow.camera.top = 15;
    mainLight.shadow.camera.bottom = -15;
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0x88aaff, 0.5);
    fillLight.position.set(-5, 3, -8);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffaa66, 0.4);
    rimLight.position.set(-3, 1, 10);
    scene.add(rimLight);

    const pointLight = new THREE.PointLight(0xff8833, 0.6, 20);
    pointLight.position.set(2, 4, -3);
    scene.add(pointLight);

    // ---- reflective wet floor (voxel-ish grid) ----
    const floorGroup = new THREE.Group();
    const gridSize = 16;
    const tileSize = 1.2;
    const offset = (gridSize * tileSize) / 2 - tileSize/2;

    // Floor tiles with subtle variation
    const baseColor = new THREE.Color(0x2a2a3a);
    const colorVariation = 0.15;
    for (let i = 0; i < gridSize; i++) {
      for (let j = 0; j < gridSize; j++) {
        const x = i * tileSize - offset;
        const z = j * tileSize - offset;
        // skip some tiles for "ruin" feel
        if ((i+j) % 7 === 0 && (i*j) % 3 === 0) continue;
        
        const color = baseColor.clone();
        const r = 0.7 + Math.random() * 0.3;
        color.multiplyScalar(r);
        
        const mat = new THREE.MeshStandardMaterial({
          color: color,
          roughness: 0.15,
          metalness: 0.85,
          emissive: new THREE.Color(0x111122),
          emissiveIntensity: 0.08,
        });
        const geo = new THREE.BoxGeometry(tileSize * 0.98, 0.2, tileSize * 0.98);
        const tile = new THREE.Mesh(geo, mat);
        tile.position.set(x, -0.1, z);
        tile.receiveShadow = true;
        tile.castShadow = false;
        floorGroup.add(tile);
      }
    }

    // Wet reflection overlay: transparent plane with subtle mirror
    const mirrorMat = new THREE.MeshStandardMaterial({
      color: 0x446688,
      emissive: 0x112233,
      emissiveIntensity: 0.1,
      roughness: 0.05,
      metalness: 0.95,
      transparent: true,
      opacity: 0.25,
    });
    const mirrorPlane = new THREE.Mesh(new THREE.PlaneGeometry(gridSize * tileSize + 2, gridSize * tileSize + 2), mirrorMat);
    mirrorPlane.rotation.x = -Math.PI / 2;
    mirrorPlane.position.set(0, 0.05, 0);
    mirrorPlane.receiveShadow = false;
    floorGroup.add(mirrorPlane);

    scene.add(floorGroup);

    // ---- environment: ancient pillars, ruins, torches ----
    function createPillar(x, z, h = 2.0, colorVariant = 0) {
      const group = new THREE.Group();
      const baseColor = new THREE.Color(0x7a6a5a);
      const stoneMat = new THREE.MeshStandardMaterial({
        color: baseColor.clone().multiplyScalar(0.8 + Math.random()*0.4),
        roughness: 0.7,
        metalness: 0.1,
        emissive: new THREE.Color(0x221100),
        emissiveIntensity: 0.05,
      });
      const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.8, h, 0.8), stoneMat);
      pillar.position.y = h/2;
      pillar.castShadow = true;
      pillar.receiveShadow = true;
      group.add(pillar);

      // capital
      const capMat = new THREE.MeshStandardMaterial({
        color: 0x8a7a6a,
        roughness: 0.6,
        metalness: 0.2,
      });
      const cap = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.2, 1.0), capMat);
      cap.position.y = h + 0.1;
      cap.castShadow = true;
      cap.receiveShadow = true;
      group.add(cap);

      group.position.set(x, 0, z);
      return group;
    }

    // scattered pillars
    const pillarPositions = [
      [-5, -4], [5, -3], [-4, 5], [4, 4], [-6, 1], [6, -1], [0, -6], [-2, -5], [2, 5]
    ];
    pillarPositions.forEach(pos => {
      const h = 1.8 + Math.random() * 1.2;
      const pillar = createPillar(pos[0], pos[1], h);
      scene.add(pillar);
    });

    // glowing crystal / torch effects (floating embers)
    function createTorch(x, z) {
      const group = new THREE.Group();
      const poleMat = new THREE.MeshStandardMaterial({ color: 0x554433, roughness: 0.8 });
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 0.9), poleMat);
      pole.position.y = 0.45;
      pole.castShadow = true;
      pole.receiveShadow = true;
      group.add(pole);

      const flameMat = new THREE.MeshStandardMaterial({
        color: 0xff6633,
        emissive: 0xff4400,
        emissiveIntensity: 0.8,
      });
      const flame = new THREE.Mesh(new THREE.SphereGeometry(0.25, 6, 6), flameMat);
      flame.position.y = 0.95;
      flame.castShadow = true;
      group.add(flame);

      // glow point light
      const light = new THREE.PointLight(0xff5500, 0.6, 5);
      light.position.set(0, 1.0, 0);
      group.add(light);

      group.position.set(x, 0, z);
      return group;
    }

    const torchPositions = [[-3, -3], [3, -2], [-2, 3], [4, 2], [-4, -4], [2, -4]];
    torchPositions.forEach(pos => {
      const t = createTorch(pos[0], pos[1]);
      scene.add(t);
    });

    // small ruin stones
    for (let i = 0; i < 40; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 3 + Math.random() * 6;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      const stoneMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(0x6a5a4a).multiplyScalar(0.6 + Math.random()*0.5),
        roughness: 0.9,
      });
      const stone = new THREE.Mesh(new THREE.DodecahedronGeometry(0.2 + Math.random()*0.25), stoneMat);
      stone.position.set(x, 0.1, z);
      stone.rotation.set(Math.random()*6, Math.random()*6, Math.random()*6);
      stone.castShadow = true;
      stone.receiveShadow = true;
      scene.add(stone);
    }

    // ---- character (voxel-ish knight) ----
    const charGroup = new THREE.Group();
    const charBodyMat = new THREE.MeshStandardMaterial({ color: 0x4a6a8a, roughness: 0.4, metalness: 0.6 });
    const charDarkMat = new THREE.MeshStandardMaterial({ color: 0x2a3a4a, roughness: 0.6, metalness: 0.3 });
    const charGoldMat = new THREE.MeshStandardMaterial({ color: 0xccaa66, roughness: 0.3, metalness: 0.7 });
    const charHeadMat = new THREE.MeshStandardMaterial({ color: 0xdbb88c, roughness: 0.5 });

    // body (torso)
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.6), charBodyMat);
    torso.position.y = 0.95;
    torso.castShadow = true;
    torso.receiveShadow = true;
    charGroup.add(torso);

    // head
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), charHeadMat);
    head.position.y = 1.55;
    head.castShadow = true;
    head.receiveShadow = true;
    charGroup.add(head);

    // helmet visor
    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.1), charGoldMat);
    visor.position.set(0, 1.55, 0.35);
    charGroup.add(visor);

    // legs
    const legMat = new THREE.MeshStandardMaterial({ color: 0x3a4a5a, roughness: 0.7, metalness: 0.2 });
    const legPos = [[-0.25, 0.35, 0.15], [0.25, 0.35, 0.15], [-0.25, 0.35, -0.15], [0.25, 0.35, -0.15]];
    legPos.forEach(pos => {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.2), legMat);
      leg.position.set(pos[0], pos[1], pos[2]);
      leg.castShadow = true;
      leg.receiveShadow = true;
      charGroup.add(leg);
    });

    // shoulders / pauldrons
    const pauldronMat = new THREE.MeshStandardMaterial({ color: 0x5a7a8a, roughness: 0.3, metalness: 0.5 });
    const paulL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.5), pauldronMat);
    paulL.position.set(-0.6, 1.2, 0);
    paulL.castShadow = true;
    charGroup.add(paulL);
    const paulR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.5), pauldronMat);
    paulR.position.set(0.6, 1.2, 0);
    paulR.castShadow = true;
    charGroup.add(paulR);

    // sword (held)
    const swordGroup = new THREE.Group();
    const bladeMat = new THREE.MeshStandardMaterial({ color: 0xccddee, metalness: 0.9, roughness: 0.2 });
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.8, 0.02), bladeMat);
    blade.position.y = 0.4;
    swordGroup.add(blade);
    const handle = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.1), charGoldMat);
    handle.position.y = -0.05;
    swordGroup.add(handle);
    const guard = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.1), charGoldMat);
    guard.position.y = 0.05;
    swordGroup.add(guard);
    swordGroup.position.set(0.65, 1.2, 0.2);
    swordGroup.rotation.z = -0.3;
    swordGroup.rotation.x = -0.2;
    charGroup.add(swordGroup);

    // shield (on back)
    const shieldMat = new THREE.MeshStandardMaterial({ color: 0x3a5a7a, metalness: 0.6, roughness: 0.3 });
    const shield = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.08), shieldMat);
    shield.position.set(-0.3, 1.0, -0.45);
    shield.castShadow = true;
    charGroup.add(shield);

    charGroup.position.set(0, 0.1, 0);
    scene.add(charGroup);

    // ---- idle animation: subtle float & sword sway ----
    let time = 0;

    // ---- click to move (raycaster) ----
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let targetPos = new THREE.Vector3(0, 0.1, 0);
    let isMoving = false;
    const moveSpeed = 0.08;
    const bounds = 6.5; // limited movement area

    renderer.domElement.addEventListener('click', (event) => {
      mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
      mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(floorGroup.children, true);
      if (intersects.length > 0) {
        const point = intersects[0].point;
        let x = Math.min(bounds, Math.max(-bounds, point.x));
        let z = Math.min(bounds, Math.max(-bounds, point.z));
        targetPos.set(x, 0.1, z);
        isMoving = true;
        document.getElementById('pos-indicator').innerText = 'moving ⚔️';
      }
    });

    // ---- camera lazy follow (update target) ----
    let cameraTargetOffset = new THREE.Vector3(0, 1.5, 0);

    // ---- resize ----
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---- animation loop ----
    function animate() {
      requestAnimationFrame(animate);
      time += 0.01;

      // move character toward target
      if (isMoving) {
        const dx = targetPos.x - charGroup.position.x;
        const dz = targetPos.z - charGroup.position.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        if (dist > 0.05) {
          const step = Math.min(moveSpeed, dist);
          charGroup.position.x += (dx / dist) * step;
          charGroup.position.z += (dz / dist) * step;
          // face movement direction
          const angle = Math.atan2(dx, dz);
          charGroup.rotation.y = angle;
        } else {
          isMoving = false;
          document.getElementById('pos-indicator').innerText = 'standing still';
        }
      }

      // idle sway / breathing
      const breathe = Math.sin(time * 1.5) * 0.008;
      charGroup.position.y = 0.1 + breathe * 0.5;
      // sword sway
      swordGroup.rotation.z = -0.3 + Math.sin(time * 1.2) * 0.04;
      swordGroup.rotation.x = -0.2 + Math.cos(time * 0.9) * 0.03;

      // torches flicker
      scene.children.forEach(child => {
        if (child.type === 'Group' && child.children.length > 2 && child.children[2] instanceof THREE.PointLight) {
          const intensity = 0.5 + Math.random() * 0.4;
          child.children[2].intensity = intensity;
        }
      });

      // lazy camera follow: smoothly move target toward character
      const targetVec = new THREE.Vector3(charGroup.position.x, 1.5, charGroup.position.z);
      controls.target.lerp(targetVec, 0.04);
      controls.update();

      renderer.render(scene, camera);
    }

    animate();

    // small particle effect (embers / floating dust)
    const particleCount = 300;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      const radius = 2 + Math.random() * 7;
      const angle = Math.random() * Math.PI * 2;
      const height = Math.random() * 3 + 0.5;
      particlePos[i] = Math.cos(angle) * radius;
      particlePos[i+1] = height;
      particlePos[i+2] = Math.sin(angle) * radius;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0xffaa77,
      size: 0.06,
      transparent: true,
      blending: THREE.AdditiveBlending,
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // animate particles
    setInterval(() => {
      const pos = particles.geometry.attributes.position.array;
      for (let i = 0; i < pos.length; i += 3) {
        pos[i+1] += (Math.random() - 0.5) * 0.02;
        if (pos[i+1] > 3.5) pos[i+1] = 0.5;
        if (pos[i+1] < 0.2) pos[i+1] = 3.0;
      }
      particles.geometry.attributes.position.needsUpdate = true;
    }, 150);

    console.log('✨ Voxel Fantasy · Wet Floor');
  </script>
</body>
</html>
