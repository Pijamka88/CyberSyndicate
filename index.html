<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Isometric Voxel Fantasy · Three.js</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
    #info {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(10, 10, 16, 0.7); backdrop-filter: blur(6px);
      padding: 10px 22px; border-radius: 40px; color: #d0d9e6;
      font-size: 14px; letter-spacing: 0.4px; border: 1px solid #3a4458;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6); pointer-events: none;
      white-space: nowrap;
    }
    #info span { color: #b8c7ff; font-weight: 600; }
    @media (max-width: 600px) { #info { font-size: 11px; padding: 6px 14px; } }
  </style>
</head>
<body>
  <div id="info">🖱️ <span>Click</span> to move · <span>Drag</span> to orbit · <span>Scroll</span> to zoom</div>

  <!-- Import maps and Three.js from CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';

    // --- setup scene ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111a2b); // deep twilight
    scene.fog = new THREE.Fog(0x111a2b, 18, 40);

    // --- camera (isometric-ish) ---
    const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 80);
    camera.position.set(16, 14, 18);
    camera.lookAt(0, 0, 0);

    // --- renderer with subtle reflection & antialiasing ---
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // --- orbit controls (lazy follow + rotation/zoom) ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.5, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotate = false;
    controls.enableZoom = true;
    controls.zoomSpeed = 0.8;
    controls.rotateSpeed = 0.6;
    controls.maxPolarAngle = Math.PI / 2.2;
    controls.minDistance = 6;
    controls.maxDistance = 30;
    controls.update();

    // --- lighting (volumetric / moody) ---
    // ambient fill
    const ambient = new THREE.AmbientLight(0x404b6a, 0.6);
    scene.add(ambient);

    // key directional light (warm)
    const keyLight = new THREE.DirectionalLight(0xffd6a0, 1.4);
    keyLight.position.set(10, 18, 8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    const d = 18;
    keyLight.shadow.camera.left = -d;
    keyLight.shadow.camera.right = d;
    keyLight.shadow.camera.top = d;
    keyLight.shadow.camera.bottom = -d;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 35;
    keyLight.shadow.bias = -0.001;
    scene.add(keyLight);

    // fill light (cool)
    const fillLight = new THREE.DirectionalLight(0x8ab0ff, 0.5);
    fillLight.position.set(-8, 6, -10);
    scene.add(fillLight);

    // rim / back light
    const rimLight = new THREE.DirectionalLight(0xffbb88, 0.4);
    rimLight.position.set(-5, 4, 12);
    scene.add(rimLight);

    // subtle point light for character glow
    const charGlow = new THREE.PointLight(0xff8844, 0.7, 12);
    charGlow.position.set(0, 2, 0);
    scene.add(charGlow);

    // --- ground plane with reflective wet look (voxel-ish grid) ---
    const groundSize = 20;
    const gridHelper = new THREE.GridHelper(groundSize, 20, 0x88bbff, 0x445577);
    gridHelper.position.y = -0.01;
    scene.add(gridHelper);

    // semi-transparent reflective plane (wet floor effect)
    const planeGeometry = new THREE.CircleGeometry(groundSize/1.8, 32);
    const planeMaterial = new THREE.MeshStandardMaterial({
      color: 0x1a2744,
      roughness: 0.12,
      metalness: 0.85,
      transparent: true,
      opacity: 0.45,
      envMapIntensity: 0.9,
    });
    const wetPlane = new THREE.Mesh(planeGeometry, planeMaterial);
    wetPlane.rotation.x = -Math.PI / 2;
    wetPlane.position.y = 0.01;
    wetPlane.receiveShadow = true;
    scene.add(wetPlane);

    // extra glossy patches (puddles)
    for (let i = 0; i < 30; i++) {
      const puddleSize = 0.2 + Math.random() * 0.8;
      const puddle = new THREE.Mesh(
        new THREE.CircleGeometry(puddleSize, 8),
        new THREE.MeshStandardMaterial({
          color: 0x88aaff,
          roughness: 0.05,
          metalness: 0.95,
          transparent: true,
          opacity: 0.15 + Math.random() * 0.2,
        })
      );
      puddle.rotation.x = -Math.PI / 2;
      const angle = Math.random() * Math.PI * 2;
      const radius = 2 + Math.random() * 6;
      puddle.position.set(Math.cos(angle) * radius, 0.015, Math.sin(angle) * radius);
      scene.add(puddle);
    }

    // --- build a fantasy "voxel" environment (Elden Ring / Diablo mood) ---

    // 1. central ruined structure (columns + arch)
    function createPillar(x, z, h = 1.8, colorVariant = 0) {
      const group = new THREE.Group();
      const baseColor = new THREE.Color().setHSL(0.08, 0.4, 0.2 + colorVariant * 0.08);
      const pillarMat = new THREE.MeshStandardMaterial({
        color: baseColor,
        roughness: 0.7,
        metalness: 0.3,
        emissive: new THREE.Color(0x221100),
        emissiveIntensity: 0.05,
      });
      // main pillar (voxel stack)
      const segments = Math.floor(h / 0.4);
      for (let i = 0; i < segments; i++) {
        const box = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.5), pillarMat);
        box.position.y = 0.2 + i * 0.4;
        box.castShadow = true;
        box.receiveShadow = true;
        group.add(box);
      }
      // capital
      const cap = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.15, 0.7), pillarMat);
      cap.position.y = h + 0.1;
      cap.castShadow = true;
      cap.receiveShadow = true;
      group.add(cap);

      group.position.set(x, 0, z);
      return group;
    }

    function createArch(x, z, angle = 0) {
      const group = new THREE.Group();
      const stoneMat = new THREE.MeshStandardMaterial({
        color: 0x6a5a4a,
        roughness: 0.8,
        metalness: 0.1,
        emissive: new THREE.Color(0x1a1008),
        emissiveIntensity: 0.1,
      });
      const stoneMatLight = new THREE.MeshStandardMaterial({
        color: 0x8a7a5a,
        roughness: 0.7,
        metalness: 0.1,
      });
      // left pillar
      const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.6, 0.4), stoneMat);
      p1.position.set(-0.8, 0.8, 0);
      p1.castShadow = true;
      p1.receiveShadow = true;
      group.add(p1);
      // right pillar
      const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.6, 0.4), stoneMat);
      p2.position.set(0.8, 0.8, 0);
      p2.castShadow = true;
      p2.receiveShadow = true;
      group.add(p2);
      // arch top
      const archBlock = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.3, 0.4), stoneMatLight);
      archBlock.position.set(0, 1.7, 0);
      archBlock.castShadow = true;
      archBlock.receiveShadow = true;
      group.add(archBlock);
      // decorative
      const deco = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.15, 0.3), stoneMatLight);
      deco.position.set(0, 1.95, 0);
      deco.castShadow = true;
      deco.receiveShadow = true;
      group.add(deco);

      group.position.set(x, 0, z);
      group.rotation.y = angle;
      return group;
    }

    // place ruins in a circle
    const ruinPositions = [
      [-4, -3], [4, -2.5], [-3.5, 4], [3.8, 3.5], [-5.5, 1], [5.2, 1.2], [-1, -5], [1.2, -4.5]
    ];
    ruinPositions.forEach(([x, z], i) => {
      const pillar = createPillar(x, z, 1.2 + Math.random() * 1.0, i % 3);
      scene.add(pillar);
      // sometimes add arch
      if (i % 2 === 0) {
        const arch = createArch(x + (Math.random() > 0.5 ? 1.2 : -1.2), z + (Math.random() > 0.5 ? 1.2 : -1.2), Math.random() * Math.PI);
        scene.add(arch);
      }
    });

    // 2. scattered voxel debris / crystals
    const debrisMat = new THREE.MeshStandardMaterial({
      color: 0x7a6a5a,
      roughness: 0.6,
      metalness: 0.2,
      emissive: new THREE.Color(0x332211),
      emissiveIntensity: 0.08,
    });
    for (let i = 0; i < 60; i++) {
      const size = 0.08 + Math.random() * 0.25;
      const debris = new THREE.Mesh(new THREE.BoxGeometry(size, size * (0.5 + Math.random()), size), debrisMat);
      const angle = Math.random() * Math.PI * 2;
      const radius = 2 + Math.random() * 7;
      debris.position.set(Math.cos(angle) * radius, size/2, Math.sin(angle) * radius);
      debris.rotation.set(Math.random() * 0.5, Math.random() * 0.5, Math.random() * 0.5);
      debris.castShadow = true;
      debris.receiveShadow = true;
      scene.add(debris);
    }

    // 3. glowing crystals (fantasy)
    const crystalColors = [0xff6644, 0x44aaff, 0xaa66ff];
    for (let i = 0; i < 16; i++) {
      const color = crystalColors[i % crystalColors.length];
      const crystalMat = new THREE.MeshStandardMaterial({
        color: color,
        emissive: color,
        emissiveIntensity: 0.2 + Math.random() * 0.3,
        roughness: 0.2,
        metalness: 0.6,
      });
      const crystal = new THREE.Mesh(new THREE.ConeGeometry(0.2 + Math.random()*0.15, 0.4 + Math.random()*0.3, 5), crystalMat);
      const angle = Math.random() * Math.PI * 2;
      const radius = 3 + Math.random() * 5;
      crystal.position.set(Math.cos(angle) * radius, 0.2, Math.sin(angle) * radius);
      crystal.castShadow = true;
      crystal.receiveShadow = true;
      scene.add(crystal);
      // add a small glow point
      const glow = new THREE.PointLight(color, 0.2, 2);
      glow.position.copy(crystal.position);
      glow.position.y += 0.2;
      scene.add(glow);
    }

    // 4. floating particles / embers (alive)
    const particleCount = 300;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    const particleSpeeds = new Float32Array(particleCount);
    for (let i = 0; i < particleCount; i++) {
      const theta = Math.random() * Math.PI * 2;
      const r = 2 + Math.random() * 8;
      particlePos[i*3] = Math.cos(theta) * r;
      particlePos[i*3+1] = 0.2 + Math.random() * 3.5;
      particlePos[i*3+2] = Math.sin(theta) * r;
      particleSpeeds[i] = 0.002 + Math.random() * 0.006;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0xffaa66,
      size: 0.08,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // 5. character (voxel-style knight)
    const characterGroup = new THREE.Group();
    // body
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a3a3a, roughness: 0.6, metalness: 0.3 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 0.5), bodyMat);
    body.position.y = 0.4;
    body.castShadow = true;
    body.receiveShadow = true;
    characterGroup.add(body);
    // head
    const headMat = new THREE.MeshStandardMaterial({ color: 0xccbbaa, roughness: 0.5, metalness: 0.1 });
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.4), headMat);
    head.position.y = 0.95;
    head.castShadow = true;
    head.receiveShadow = true;
    characterGroup.add(head);
    // helm (visor)
    const helmMat = new THREE.MeshStandardMaterial({ color: 0x887766, roughness: 0.3, metalness: 0.7 });
    const helm = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.35), helmMat);
    helm.position.set(0, 0.95, -0.1);
    helm.castShadow = true;
    helm.receiveShadow = true;
    characterGroup.add(helm);
    // shoulders
    const shoulderMat = new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: 0.7, metalness: 0.4 });
    const shoulderL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.15, 0.3), shoulderMat);
    shoulderL.position.set(-0.5, 0.7, 0);
    shoulderL.castShadow = true;
    shoulderL.receiveShadow = true;
    characterGroup.add(shoulderL);
    const shoulderR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.15, 0.3), shoulderMat);
    shoulderR.position.set(0.5, 0.7, 0);
    shoulderR.castShadow = true;
    shoulderR.receiveShadow = true;
    characterGroup.add(shoulderR);
    // cape (flowing)
    const capeMat = new THREE.MeshStandardMaterial({ color: 0x7a1a1a, roughness: 0.9, metalness: 0.1 });
    const cape = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.1), capeMat);
    cape.position.set(0, 0.5, -0.35);
    cape.castShadow = true;
    cape.receiveShadow = true;
    characterGroup.add(cape);

    characterGroup.position.set(0, 0, 0);
    scene.add(characterGroup);

    // --- movement & click handling ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const planeY = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const targetPosition = new THREE.Vector3(0, 0, 0);
    let isMoving = false;
    const moveSpeed = 0.08;

    function onPointerDown(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      const intersection = new THREE.Vector3();
      const intersected = raycaster.ray.intersectPlane(planeY, intersection);
      if (intersected) {
        // limit movement radius (within the wet floor)
        const limit = 7.5;
        const x = Math.max(-limit, Math.min(limit, intersection.x));
        const z = Math.max(-limit, Math.min(limit, intersection.z));
        targetPosition.set(x, 0, z);
        isMoving = true;
      }
    }

    renderer.domElement.addEventListener('click', onPointerDown);
    // also touch support
    renderer.domElement.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      onPointerDown({ clientX: touch.clientX, clientY: touch.clientY });
    }, { passive: false });

    // --- animation loop ---
    let clock = new THREE.Clock();

    function animate() {
      const delta = clock.getDelta();
      const elapsed = performance.now() / 1000;

      // character movement with smooth interpolation
      if (isMoving) {
        const currentPos = characterGroup.position;
        const dx = targetPosition.x - currentPos.x;
        const dz = targetPosition.z - currentPos.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        if (dist < 0.02) {
          isMoving = false;
          currentPos.x = targetPosition.x;
          currentPos.z = targetPosition.z;
        } else {
          const step = Math.min(moveSpeed, dist);
          currentPos.x += (dx / dist) * step;
          currentPos.z += (dz / dist) * step;
          // face movement direction
          const angle = Math.atan2(dx, dz);
          characterGroup.rotation.y = angle;
        }
      }

      // animate particles (float upward, reset)
      const positions = particles.geometry.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        positions[i*3+1] += particleSpeeds[i] * delta * 20;
        if (positions[i*3+1] > 3.5) {
          positions[i*3+1] = 0.2;
          const theta = Math.random() * Math.PI * 2;
          const r = 2 + Math.random() * 8;
          positions[i*3] = Math.cos(theta) * r;
          positions[i*3+2] = Math.sin(theta) * r;
        }
      }
      particles.geometry.attributes.position.needsUpdate = true;

      // subtle character bob / idle
      const bob = Math.sin(elapsed * 1.8) * 0.015;
      characterGroup.position.y = bob;
      // cape sway
      cape.rotation.z = Math.sin(elapsed * 1.2) * 0.04;

      // lazy follow: update controls target to character
      controls.target.lerp(characterGroup.position, 0.04);
      controls.update();

      // update char glow
      charGlow.position.copy(characterGroup.position);
      charGlow.position.y += 1.2;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    // --- resize handler ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    console.log('✨ Dream-loop active · Fantasy isometric voxel scene');
  </script>
</body>
</html>
